# coturn для Parvane (альтернатива нашему parvane-turn, если нужен «настоящий»
# coturn). Установка: sudo pacman -S coturn. Запуск: turnserver -c coturn.conf
# Клиент указывает: PARVANE_TURN=turn:<host>:3478 PARVANE_TURN_USER=parvane
# PARVANE_TURN_PASS=parvane  (+ PARVANE_STUN=stun:<host>:3478)

listening-port=3478
# Внешний IP сервера (в relay-кандидатах). Заменить на реальный публичный IP.
external-ip=127.0.0.1
realm=parvane
# Long-term credentials (для NAT-релея нужна аутентификация).
lt-cred-mech
user=parvane:parvane
# Диапазон relay-портов (открыть в firewall при развёртывании).
min-port=49152
max-port=65535
# Логи в stdout, без файла.
no-cli
fingerprint
