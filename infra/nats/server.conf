# Parvane NATS server config
# Каждый компонент подключается с отдельным пользователем и видит только свои топики.

port: 4222

authorization {
  users = [
    # Identity шард
    {
      user: identity
      password: identity-secret
      permissions: {
        subscribe: [
          "identity.token.issue", "identity.token.verify", "identity.user.register", "identity.email.confirm",
          "identity.user.search", "identity.user.setname", "identity.user.setavatar",
          "identity.user.setkey", "identity.user.resolve",
          "identity.prekeys.publish", "identity.prekeys.fetch", "identity.device.list", "identity.device.revoke"
        ]
        publish:   ["_INBOX.>"]
      }
    }

    # Messenger шард
    {
      user: messenger
      password: messenger-secret
      permissions: {
        subscribe: [
          "msg.chat.send", "msg.chat.read", "msg.chat.edit", "msg.chat.delete",
          "msg.chat.react", "msg.chat.pin", "msg.chat.ack", "msg.sync.request",
          "group.create", "group.addmember", "group.removemember",
          "group.setrole", "group.ban", "group.unban", "group.mute",
          "group.invite.create", "group.join", "group.rename", "group.delete", "group.list", "group.info",
          "_INBOX.>"
        ]
        publish: [
          "msg.user.>", "_INBOX.>", "identity.token.verify"
        ]
      }
    }

    # Cloud шард
    {
      user: cloud
      password: cloud-secret
      permissions: {
        subscribe: [
          "file.upload.chunk", "file.upload.complete", "file.download.request",
          "file.list.request", "_INBOX.>"
        ]
        publish: [
          "_INBOX.>", "identity.token.verify"
        ]
      }
    }

    # Notes шард (CRDT заметок; UI пока не подключён)
    {
      user: notes
      password: notes-secret
      permissions: {
        subscribe: [
          "note.create", "note.update", "note.delete", "note.sync.request",
          "_INBOX.>"
        ]
        publish: ["_INBOX.>", "identity.token.verify"]
      }
    }

    # Calendar шард (CRDT событий; UI пока не подключён)
    {
      user: calendar
      password: calendar-secret
      permissions: {
        subscribe: [
          "cal.event.create", "cal.event.update", "cal.event.delete",
          "cal.sync.request", "_INBOX.>"
        ]
        publish: ["_INBOX.>", "identity.token.verify"]
      }
    }

    # Call шард (сигналинг звонков)
    {
      user: call
      password: call-secret
      permissions: {
        subscribe: ["call.signal", "call.history.request", "call.ice.request", "_INBOX.>"]
        # релеит сигналы в персональные инбоксы call.user.* и отвечает на историю
        publish:   ["call.user.>", "_INBOX.>", "identity.token.verify"]
      }
    }

    # Preview шард (SSRF-safe fetcher превью ссылок)
    {
      user: preview
      password: preview-secret
      permissions: {
        subscribe: ["preview.link.fetch", "_INBOX.>"]
        publish:   ["_INBOX.>", "identity.token.verify"]
      }
    }

    # Push шард (web-push VAPID для офлайн-устройств; контент инбоксов sealed)
    {
      user: push
      password: push-secret
      permissions: {
        subscribe: ["push.vapid.get", "push.device.register", "push.device.unregister", "msg.user.>", "_INBOX.>"]
        publish:   ["_INBOX.>", "identity.token.verify"]
      }
    }

    # Gateway — единственная точка входа клиентов (WS→NATS). Права широкие
    # (доверенный компонент); изоляция «людей» — внутри gateway по JWT.
    {
      user: gateway
      password: gateway-secret
      permissions: {
        publish: [
          "identity.token.issue", "identity.token.verify", "identity.user.register", "identity.email.confirm",
          "identity.user.search", "identity.user.setname", "identity.user.setavatar",
          "identity.user.setkey", "identity.user.resolve",
          "identity.prekeys.publish", "identity.prekeys.fetch", "identity.device.list", "identity.device.revoke",
          "msg.chat.send", "msg.chat.read", "msg.chat.edit", "msg.chat.delete",
          "msg.chat.react", "msg.chat.pin", "msg.chat.ack", "msg.sync.request",
          "file.upload.chunk", "file.upload.complete", "file.download.request",
          "file.list.request", "call.signal", "call.history.request", "call.ice.request",
          "group.create", "group.addmember", "group.removemember",
          "group.setrole", "group.ban", "group.unban", "group.mute",
          "group.invite.create", "group.join", "group.rename", "group.delete", "group.list", "group.info",
          "preview.link.fetch", "push.vapid.get", "push.device.register", "push.device.unregister",
          "msg.typing.>", "presence.>"
        ]
        subscribe: [
          "msg.user.>", "call.user.>", "msg.typing.>", "presence.>", "_INBOX.>"
        ]
      }
    }

    # Клиент (Tauri / прямой cnats — DEV. В проде клиенты ходят через gateway,
    # см. server.prod.conf, где этого юзера нет.)
    {
      user: client
      password: client-secret
      permissions: {
        publish: [
          "identity.token.issue", "identity.token.verify", "identity.user.register", "identity.email.confirm",
          "identity.user.search", "identity.user.setname", "identity.user.setavatar",
          "identity.user.setkey", "identity.user.resolve",
          "identity.prekeys.publish", "identity.prekeys.fetch", "identity.device.list", "identity.device.revoke",
          "msg.chat.send", "msg.chat.read", "msg.chat.edit", "msg.chat.delete",
          "msg.chat.react", "msg.chat.pin", "msg.chat.ack", "msg.sync.request",
          "file.upload.chunk", "file.upload.complete", "file.download.request",
          "file.list.request", "call.signal", "call.history.request", "call.ice.request",
          "group.create", "group.addmember", "group.removemember",
          "group.setrole", "group.ban", "group.unban", "group.mute",
          "group.invite.create", "group.join", "group.rename", "group.delete", "group.list", "group.info",
          "preview.link.fetch", "push.vapid.get", "push.device.register", "push.device.unregister",
          "msg.typing.>", "presence.>"
        ]
        subscribe: [
          "msg.user.>", "call.user.>", "msg.typing.>", "presence.>", "_INBOX.>"
        ]
      }
    }

    # Dev/тесты — без ограничений
    {
      user: dev
      password: dev
      permissions: {
        publish:   [">"]
        subscribe: [">"]
      }
    }
  ]
}
