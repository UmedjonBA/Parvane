// Блобы (PVB2, BLOB-1) и облако как домен каркаса (spec 016).
// Лимиты по умолчанию: чанк ≤ 716800, ≤ 100 000 чанков, ≤ 32 незавершённых
// загрузок (24 ч без активности), скачивание ≤ 256 чанков за запрос.
// Блобы делятся на bucket'ы со своими пределами: медиа чатов (файл ≤ 512 МиБ,
// квота 4 ГиБ на владельца) и облако (файл ≤ 2 ГиБ открытого текста, квота
// 10 ГиБ) — задаются окружением шарда.
syntax = "proto3";

package parvane.cloud.v1;

import "parvane/core/v2/domain.proto";
import "parvane/core/v2/options.proto";
import "parvane/core/v2/registry.proto";

service BlobService {
  rpc UploadChunk(UploadChunkRequest) returns (UploadChunkResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.blob.upload_chunk"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_UPLOAD
      kind: METHOD_KIND_CALL
      shard: "cloud"
    };
  }
  rpc UploadComplete(UploadCompleteRequest) returns (UploadCompleteResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.blob.upload_complete"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "cloud"
    };
  }
  rpc Download(DownloadRequest) returns (DownloadResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.blob.download"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_STREAM
      shard: "cloud"
      federated: true
    };
  }
  // D-08: вложения сообщений — по capability (секрет из E2E-сообщения) через
  // анонимный канал, без грантов на получателей.
  rpc DownloadCap(DownloadCapRequest) returns (DownloadCapResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.blob.download_cap"
      channel: METHOD_CHANNEL_ANON
      rate: RATE_CLASS_ANON
      kind: METHOD_KIND_STREAM
      shard: "cloud"
      federated: true
    };
  }
  rpc Delete(DeleteRequest) returns (DeleteResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.blob.delete"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "cloud"
    };
  }
  // Занятое место и пределы вызывающего по bucket'ам (spec 016).
  rpc Usage(UsageRequest) returns (UsageResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.blob.usage"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "cloud"
    };
  }
  // Сколько чанков незавершённой загрузки принято подряд (продолжение).
  rpc UploadStatus(UploadStatusRequest) returns (UploadStatusResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.blob.upload_status"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "cloud"
    };
  }
  // Копия блоба на сервере: новый блоб вызывающего с тем же шифртекстом.
  rpc Copy(CopyRequest) returns (CopyResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.blob.copy"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_MSG
      kind: METHOD_KIND_CALL
      shard: "cloud"
    };
  }
}

// Ссылка на файлы облака для людей без аккаунта (spec 022). Ссылка — снимок:
// копии блобов владельца (bucket DRIVE, в его квоте) и зашифрованный ключом
// ссылки список. Ключ ссылки серверу не передаётся (он во фрагменте адреса).
// Копии читаются только через `cloud.link.download`: методам `cloud.blob.*`
// они не видны. Срок и состояние проверяются при каждом чтении.
service LinkService {
  // Новая ссылка в состоянии «готовится»; идентификатор выдаёт сервер.
  rpc LinkCreate(LinkCreateRequest) returns (LinkCreateResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.link.create"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "cloud"
    };
  }
  // Копия блоба в готовящуюся ссылку (повтор с тем же источником — прежняя копия).
  rpc LinkAdd(LinkAddRequest) returns (LinkAddResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.link.add"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "cloud"
    };
  }
  // Список и запись владельца; ссылка начинает действовать, срок идёт отсюда.
  rpc LinkPublish(LinkPublishRequest) returns (LinkPublishResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.link.publish"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "cloud"
    };
  }
  // Все ссылки вызывающего (готовящиеся, действующие, истёкшие).
  rpc LinkList(LinkListRequest) returns (LinkListResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.link.list"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "cloud"
    };
  }
  // Отзыв: ссылка и её копии удаляются сразу, место возвращается.
  rpc LinkRevoke(LinkRevokeRequest) returns (LinkRevokeResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.link.revoke"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "cloud"
    };
  }
  // Новый срок действующей либо истёкшей (в пределах срока льготы) ссылки.
  rpc LinkExtend(LinkExtendRequest) returns (LinkExtendResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.link.extend"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "cloud"
    };
  }
  // Список ссылки — анонимно, по идентификатору.
  rpc LinkGet(LinkGetRequest) returns (LinkGetResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.link.get"
      channel: METHOD_CHANNEL_ANON
      rate: RATE_CLASS_ANON
      kind: METHOD_KIND_CALL
      shard: "cloud"
    };
  }
  // Копия из действующей ссылки — анонимно, окнами (как download_cap).
  rpc LinkDownload(LinkDownloadRequest) returns (LinkDownloadResponse) {
    option (parvane.core.v2.method) = {
      name: "cloud.link.download"
      channel: METHOD_CHANNEL_ANON
      rate: RATE_CLASS_ANON
      kind: METHOD_KIND_STREAM
      shard: "cloud"
    };
  }
}

// К какому пределу и квоте относится блоб.
enum BlobBucket {
  // Не задан = медиа чатов, аватары, служебные блобы.
  BLOB_BUCKET_UNSPECIFIED = 0;
  // Файлы раздела «Облако».
  BLOB_BUCKET_DRIVE = 1;
}

enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  // Только владелец и получатели гранта.
  VISIBILITY_PRIVATE = 1;
  // Публичный объект (аватар); публичный шаринг — reauth.
  VISIBILITY_PUBLIC = 2;
}

message UploadChunkRequest {
  // Идентификатор загрузки (выдаёт сервер на первом чанке, index = 0).
  string upload_id = 1 [(parvane.core.v2.max_len) = 64];
  uint32 index = 2;
  bytes data = 3 [(parvane.core.v2.max_len) = 716800];
  // Учитывается только на первом чанке (index = 0).
  BlobBucket bucket = 4;
}
message UploadChunkResponse {
  string upload_id = 1 [(parvane.core.v2.max_len) = 64];
}

message UploadCompleteRequest {
  string upload_id = 1 [(parvane.core.v2.max_len) = 64];
  uint32 chunks = 2;
  uint64 size = 3;
  Visibility visibility = 4;
  // SHA-256 capability (вложение сообщения, D-08).
  bytes capability_hash = 5 [(parvane.core.v2.max_len) = 32];
}
message UploadCompleteResponse {
  string file_id = 1 [(parvane.core.v2.max_len) = 64];
}

message DownloadRequest {
  string file_id = 1 [(parvane.core.v2.max_len) = 64];
  uint32 first_chunk = 2;
  // ≤ 256.
  uint32 chunk_count = 3;
}
// Метаданные потока; сами данные — кадры StreamChunk с тем же id запроса.
message DownloadResponse {
  uint64 size = 1;
  uint32 chunks = 2;
}

message DownloadCapRequest {
  string file_id = 1 [(parvane.core.v2.max_len) = 64];
  // Секрет доступа; сервер хранит SHA-256.
  bytes capability = 2 [(parvane.core.v2.max_len) = 32];
  uint32 first_chunk = 3;
  uint32 chunk_count = 4;
}
message DownloadCapResponse {
  uint64 size = 1;
  uint32 chunks = 2;
}

message DeleteRequest {
  string file_id = 1 [(parvane.core.v2.max_len) = 64];
}
message DeleteResponse {}

message UsageRequest {}
message BucketUsage {
  BlobBucket bucket = 1;
  // Байты шифртекста: готовые файлы и незавершённые загрузки.
  uint64 used = 2;
  // 0 — без предела.
  uint64 quota = 3;
  // Предел одного файла (шифртекст).
  uint64 max_file = 4;
}
message UsageResponse {
  repeated BucketUsage buckets = 1 [(parvane.core.v2.max_items) = 4];
  // Байты копий всех ссылок вызывающего (spec 022); входят в used bucket'а DRIVE.
  uint64 links_bytes = 2;
}

message UploadStatusRequest {
  string upload_id = 1 [(parvane.core.v2.max_len) = 64];
}
message UploadStatusResponse {
  // Чанки 0..chunks-1 приняты без пропусков.
  uint32 chunks = 1;
  uint64 bytes = 2;
}

message CopyRequest {
  string file_id = 1 [(parvane.core.v2.max_len) = 64];
  // Секрет доступа к источнику; пусто — источник принадлежит вызывающему.
  bytes capability = 2 [(parvane.core.v2.max_len) = 32];
  BlobBucket bucket = 3;
  // SHA-256 секрета доступа нового блоба.
  bytes capability_hash = 4 [(parvane.core.v2.max_len) = 32];
}
message CopyResponse {
  string file_id = 1 [(parvane.core.v2.max_len) = 64];
  uint64 size = 2;
  uint32 chunks = 3;
}

// ── ссылки облака (spec 022) ─────────────────────────────────────────────────
// link_id — 16 случайных байт, base64url без `=` (22 знака). Времена — unix-
// секунды; expires_at = 0 — без срока. ttl_days — 0 (без срока), 1, 7 или 30.

enum LinkState {
  LINK_STATE_UNSPECIFIED = 0;
  // Создана, копии собираются; получателю не видна.
  LINK_STATE_PREPARING = 1;
  LINK_STATE_ACTIVE = 2;
  // Срок вышел, копии ещё не удалены: можно продлить.
  LINK_STATE_EXPIRED = 3;
}

message LinkCreateRequest {
  uint32 ttl_days = 1;
}
message LinkCreateResponse {
  string link_id = 1 [(parvane.core.v2.max_len) = 32];
}

message LinkAddRequest {
  string link_id = 1 [(parvane.core.v2.max_len) = 32];
  // Источник копии.
  string file_id = 2 [(parvane.core.v2.max_len) = 64];
  // Секрет доступа к источнику; пусто — источник принадлежит вызывающему.
  bytes capability = 3 [(parvane.core.v2.max_len) = 32];
}
// Блоб-копия: её file_id идёт в список ссылки.
message LinkAddResponse {
  string file_id = 1 [(parvane.core.v2.max_len) = 64];
  uint64 size = 2;
  uint32 chunks = 3;
}

message LinkPublishRequest {
  string link_id = 1 [(parvane.core.v2.max_len) = 32];
  // Шифртекст списка (ключ ссылки).
  bytes manifest = 2 [(parvane.core.v2.max_len) = 1048576];
  // Шифртекст записи владельца (ключ личного диска): название и ключ ссылки.
  bytes owner_record = 3 [(parvane.core.v2.max_len) = 4096];
}
message LinkPublishResponse {
  uint64 expires_at = 1;
}

message LinkListRequest {}
message LinkInfo {
  string link_id = 1 [(parvane.core.v2.max_len) = 32];
  LinkState state = 2;
  uint64 created_at = 3;
  uint64 expires_at = 4;
  // Байты копий ссылки (шифртекст).
  uint64 bytes = 5;
  uint32 files = 6;
  bytes owner_record = 7 [(parvane.core.v2.max_len) = 4096];
}
message LinkListResponse {
  repeated LinkInfo links = 1 [(parvane.core.v2.max_items) = 256];
}

message LinkRevokeRequest {
  string link_id = 1 [(parvane.core.v2.max_len) = 32];
}
message LinkRevokeResponse {}

message LinkExtendRequest {
  string link_id = 1 [(parvane.core.v2.max_len) = 32];
  uint32 ttl_days = 2;
}
message LinkExtendResponse {
  uint64 expires_at = 1;
}

message LinkGetRequest {
  string link_id = 1 [(parvane.core.v2.max_len) = 32];
}
message LinkGetResponse {
  // Пусто у истёкшей ссылки.
  bytes manifest = 1 [(parvane.core.v2.max_len) = 1048576];
  uint64 expires_at = 2;
  bool expired = 3;
}

message LinkDownloadRequest {
  string link_id = 1 [(parvane.core.v2.max_len) = 32];
  // Копия из списка ссылки.
  string file_id = 2 [(parvane.core.v2.max_len) = 64];
  uint32 first_chunk = 3;
  // ≤ 256.
  uint32 chunk_count = 4;
}
message LinkDownloadResponse {
  uint64 size = 1;
  uint32 chunks = 2;
}

// ── облако как домен каркаса (spec 016) ─────────────────────────────────────
// Контейнер с domain = "cloud.v1": личный диск пользователя либо совместная
// папка. Открытый текст ContainerOp — CloudBatch, открытый текст Snapshot —
// CloudSnapshot. Файл = узел со ссылкой на PVB2-блоб; сам блоб — BlobService
// выше (BLOB-1), bucket DRIVE.
// Сведение (backend/protocol/src/domain/cloud.rs) зависит только от итоговых
// регистров узлов, поэтому снимок ему достаточен: у узла LWW-регистры
// «родитель + имя», «содержимое», «корзина» с меткой (lamport, device_id) и
// необратимое надгробие purge. Узел, чья цепочка родителей не приходит в
// корень, показывается в корне, если его метка перемещения — наибольшая в
// цикле (либо родитель неизвестен).

enum CloudNodeKind {
  CLOUD_NODE_KIND_UNSPECIFIED = 0;
  CLOUD_NODE_KIND_FOLDER = 1;
  CLOUD_NODE_KIND_FILE = 2;
}

// Ссылка на PVB2-блоб в шарде cloud.
message CloudBlobRef {
  string file_id = 1 [(parvane.core.v2.max_len) = 64];
  // Ключ blobcrypt/PVB2 блоба (32 байта).
  bytes key = 2 [(parvane.core.v2.max_len) = 32];
  // Размер открытого файла.
  uint64 size = 3;
  uint32 chunks = 4;
  string mime = 5 [(parvane.core.v2.max_len) = 128];
  // SHA-256 открытого файла (проверка у клиента).
  bytes sha256 = 6 [(parvane.core.v2.max_len) = 32];
  bytes nonce = 7 [(parvane.core.v2.max_len) = 12];
  // Секрет доступа к блобу (cloud.blob.download_cap).
  bytes capability = 8 [(parvane.core.v2.max_len) = 32];
  // Адрес владельца блоба: его устройство стирает блоб после purge узла.
  string uploader = 9 [(parvane.core.v2.max_len) = 255];
}

// Миниатюра: отдельный блоб, зашифрованный ключом файла.
message CloudThumb {
  string file_id = 1 [(parvane.core.v2.max_len) = 64];
  bytes nonce = 2 [(parvane.core.v2.max_len) = 12];
  bytes capability = 3 [(parvane.core.v2.max_len) = 32];
  uint32 width = 4;
  uint32 height = 5;
}

// Создание узла (id — 16 случайных байт, уникален в контейнере).
message CloudCreate {
  bytes node_id = 1 [(parvane.core.v2.max_len) = 16];
  CloudNodeKind kind = 2;
  // Пусто — корень контейнера.
  bytes parent_id = 3 [(parvane.core.v2.max_len) = 16];
  string name = 4 [(parvane.core.v2.max_len) = 255];
  // Только для файла.
  CloudBlobRef blob = 5;
  parvane.core.v2.LwwStamp stamp = 6;
  CloudThumb thumb = 7;
  // Время изменения файла на устройстве, мс.
  uint64 mtime_ms = 8;
}

// Перемещение/переименование: LWW-регистр (parent_id, name) узла.
message CloudMove {
  bytes node_id = 1 [(parvane.core.v2.max_len) = 16];
  bytes parent_id = 2 [(parvane.core.v2.max_len) = 16];
  string name = 3 [(parvane.core.v2.max_len) = 255];
  parvane.core.v2.LwwStamp stamp = 4;
}

// Новое содержимое файла: LWW-регистр (blob, thumb, mtime).
message CloudSetBlob {
  bytes node_id = 1 [(parvane.core.v2.max_len) = 16];
  CloudBlobRef blob = 2;
  parvane.core.v2.LwwStamp stamp = 3;
  CloudThumb thumb = 4;
  uint64 mtime_ms = 5;
}

// Корзина: LWW-регистр (trashed, at_ms). Восстановление — trashed = false.
message CloudTrash {
  bytes node_id = 1 [(parvane.core.v2.max_len) = 16];
  bool trashed = 2;
  uint64 at_ms = 3;
  parvane.core.v2.LwwStamp stamp = 4;
}

// Окончательное удаление узла со всеми потомками. Необратимо.
message CloudPurge {
  bytes node_id = 1 [(parvane.core.v2.max_len) = 16];
  uint64 at_ms = 2;
  parvane.core.v2.LwwStamp stamp = 3;
}

// Название контейнера (совместной папки): LWW-регистр.
message CloudMeta {
  string name = 1 [(parvane.core.v2.max_len) = 255];
  parvane.core.v2.LwwStamp stamp = 2;
}

// Черновик T094, не используется (удаление — CloudTrash и CloudPurge).
message CloudDelete {
  bytes node_id = 1 [(parvane.core.v2.max_len) = 16];
  parvane.core.v2.LwwStamp stamp = 2;
}

message CloudOp {
  oneof op {
    CloudCreate create = 1;
    CloudMove move = 2;
    CloudSetBlob set_blob = 3;
    // Не используется; движок пропускает.
    CloudDelete delete = 4;
    CloudTrash trash = 5;
    CloudPurge purge = 6;
    CloudMeta meta = 7;
  }
}

// Открытый текст одной операции журнала контейнера.
message CloudBatch {
  repeated CloudOp ops = 1 [(parvane.core.v2.max_items) = 500];
}

// Черновик T094, не используется (узел снимка — CloudEntry).
message CloudNode {
  bytes node_id = 1 [(parvane.core.v2.max_len) = 16];
  CloudNodeKind kind = 2;
  bytes parent_id = 3 [(parvane.core.v2.max_len) = 16];
  string name = 4 [(parvane.core.v2.max_len) = 255];
  CloudBlobRef blob = 5;
  bool deleted = 6;
  parvane.core.v2.LwwStamp move_stamp = 7;
  parvane.core.v2.LwwStamp blob_stamp = 8;
}

// Узел в снимке: итоговое состояние регистров. Устройства меток — индексы
// в CloudSnapshot.devices.
message CloudEntry {
  bytes node_id = 1 [(parvane.core.v2.max_len) = 16];
  CloudNodeKind kind = 2;
  bytes parent_id = 3 [(parvane.core.v2.max_len) = 16];
  string name = 4 [(parvane.core.v2.max_len) = 255];
  CloudBlobRef blob = 5;
  CloudThumb thumb = 6;
  uint64 mtime_ms = 7;
  bool trashed = 8;
  uint64 trashed_at_ms = 9;
  bool purged = 10;
  uint64 purged_at_ms = 11;
  uint64 create_lamport = 12;
  uint32 create_dev = 13;
  uint64 move_lamport = 14;
  uint32 move_dev = 15;
  uint64 blob_lamport = 16;
  uint32 blob_dev = 17;
  uint64 trash_lamport = 18;
  uint32 trash_dev = 19;
}

message CloudSnapshot {
  // Не используется (черновик T094).
  repeated CloudNode nodes = 1 [(parvane.core.v2.max_items) = 16384];
  repeated string devices = 2 [
    (parvane.core.v2.max_items) = 1024,
    (parvane.core.v2.max_len) = 64
  ];
  CloudMeta meta = 3;
  repeated CloudEntry entries = 4 [(parvane.core.v2.max_items) = 16384];
}
