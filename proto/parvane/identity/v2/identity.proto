// Домен identity: сессии, аккаунт, корневые ключи и сертификаты устройств,
// линковка, профиль, ключи доступа к доставке, слепые жетоны, приватность.
// Правила аккаунта (argon2id, политика пароля, IP-лимиты, карточка без
// телефона, поиск без wildcard) переносятся из v1 без изменений.
syntax = "proto3";

package parvane.identity.v2;

import "parvane/core/v2/envelope.proto";
import "parvane/core/v2/options.proto";
import "parvane/core/v2/registry.proto";

service IdentityService {
  // ── до входа ──
  rpc SessionIssue(SessionIssueRequest) returns (SessionIssueResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.session.issue"
      channel: METHOD_CHANNEL_PRE
      rate: RATE_CLASS_PRE
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  // Продление сессии без пароля: прежний токен (срок может уже выйти) и подпись
  // ключом устройства. Пароль при этом не нужен, отзыв устройства и смена пароля
  // действуют как для обычного токена.
  rpc SessionRenew(SessionRenewRequest) returns (SessionRenewResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.session.renew"
      channel: METHOD_CHANNEL_PRE
      rate: RATE_CLASS_PRE
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc AccountRegister(AccountRegisterRequest) returns (AccountRegisterResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.account.register"
      channel: METHOD_CHANNEL_PRE
      rate: RATE_CLASS_PRE
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc AccountConfirmEmail(AccountConfirmEmailRequest) returns (AccountConfirmEmailResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.account.confirm_email"
      channel: METHOD_CHANNEL_PRE
      rate: RATE_CLASS_PRE
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc AccountConfirmTelegram(AccountConfirmTelegramRequest) returns (AccountConfirmTelegramResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.account.confirm_telegram"
      channel: METHOD_CHANNEL_PRE
      rate: RATE_CLASS_PRE
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc AccountRegisterStatus(AccountRegisterStatusRequest) returns (AccountRegisterStatusResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.account.register_status"
      channel: METHOD_CHANNEL_PRE
      rate: RATE_CLASS_PRE
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc ServerDescribe(ServerDescribeRequest) returns (ServerDescribeResponse) {
    option (parvane.core.v2.method) = {
      name: "server.describe"
      channel: METHOD_CHANNEL_PRE
      rate: RATE_CLASS_PRE
      kind: METHOD_KIND_CALL
      shard: "identity"
      federated: true
    };
  }

  // ── сессия ──
  // Свежее подтверждение паролем для методов с reauth (≤ 5 мин).
  rpc SessionReauth(SessionReauthRequest) returns (SessionReauthResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.session.reauth"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }

  // ── устройства и корень ──
  rpc DevicePublishCertificate(DevicePublishCertificateRequest) returns (DevicePublishCertificateResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.device.publish_certificate"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc DeviceFetchBundle(DeviceFetchBundleRequest) returns (DeviceFetchBundleResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.device.fetch_bundle"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc DeviceFetchBundleAnon(DeviceFetchBundleAnonRequest) returns (DeviceFetchBundleAnonResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.device.fetch_bundle_anon"
      channel: METHOD_CHANNEL_ANON
      rate: RATE_CLASS_ANON
      kind: METHOD_KIND_CALL
      shard: "identity"
      federated: true
    };
  }
  rpc DeviceLogSync(DeviceLogSyncRequest) returns (DeviceLogSyncResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.device.log_sync"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc DeviceLogSyncAnon(DeviceLogSyncAnonRequest) returns (DeviceLogSyncAnonResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.device.log_sync_anon"
      channel: METHOD_CHANNEL_ANON
      rate: RATE_CLASS_ANON
      kind: METHOD_KIND_CALL
      shard: "identity"
      federated: true
    };
  }
  rpc DeviceLogAppend(DeviceLogAppendRequest) returns (DeviceLogAppendResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.device.log_append"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc DeviceList(DeviceListRequest) returns (DeviceListResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.device.list"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc DeviceRevoke(DeviceRevokeRequest) returns (DeviceRevokeResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.device.revoke"
      channel: METHOD_CHANNEL_ID
      reauth: true
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc RootRotate(RootRotateRequest) returns (RootRotateResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.root.rotate"
      channel: METHOD_CHANNEL_ID
      reauth: true
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  // FR-066 (D-12): копия корня под ключом восстановления — на сервере, чтобы
  // новое устройство без других устройств могло восстановить корень. Сервер
  // хранит шифртекст; без ключа восстановления (≥ 128 бит) он ничего не даёт.
  rpc RootBackupSet(RootBackupSetRequest) returns (RootBackupSetResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.root.backup_set"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc RootBackupGet(RootBackupGetRequest) returns (RootBackupGetResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.root.backup_get"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  // spec 015: ключ восстановления через Telegram-бота. Сервер и Telegram видят
  // ключ открытым текстом (решение пользователя 9 окт 2026: удобство важнее —
  // ключ лежит у человека в чате с ботом). Ключ в базе не хранится: очередь
  // бота и ответ пользователя — только в памяти identity, с коротким сроком.
  // Жалоба администратору сервера (spec 024): приложенное шифруется открытым ключом администратора
  // (`ServerDescribeResponse.report_public_key`, HPKE); сервер хранит шифртекст и автора жалобы.
  rpc ReportSubmit(ReportSubmitRequest) returns (ReportSubmitResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.report.submit"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc RecoveryTgSend(RecoveryTgSendRequest) returns (RecoveryTgSendResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.recovery.tg_send"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc RecoveryTgRequest(RecoveryTgRequestRequest) returns (RecoveryTgRequestResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.recovery.tg_request"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc RecoveryTgPoll(RecoveryTgPollRequest) returns (RecoveryTgPollResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.recovery.tg_poll"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  // Вызывает бот (общий секрет): забрать сообщения для Telegram.
  rpc TelegramPull(TelegramPullRequest) returns (TelegramPullResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.telegram.pull"
      channel: METHOD_CHANNEL_PRE
      rate: RATE_CLASS_PRE
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  // Вызывает бот (общий секрет): ответ пользователя с ключом восстановления.
  rpc TelegramReply(TelegramReplyRequest) returns (TelegramReplyResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.telegram.reply"
      channel: METHOD_CHANNEL_PRE
      rate: RATE_CLASS_PRE
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }

  // ── аккаунт ──
  rpc AccountSet2fa(AccountSet2faRequest) returns (AccountSet2faResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.account.set_2fa"
      channel: METHOD_CHANNEL_ID
      reauth: true
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc AccountGet2fa(AccountGet2faRequest) returns (AccountGet2faResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.account.get_2fa"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  // Удаление аккаунта (spec 027): аккаунт сразу выходит со всех устройств и скрыт от других; через 7 дней всё
  // стирается и ник свободен. До этого вход паролем с `cancel_deletion` отменяет удаление.
  rpc AccountDelete(AccountDeleteRequest) returns (AccountDeleteResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.account.delete"
      channel: METHOD_CHANNEL_ID
      reauth: true
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  // Смена ника (spec 026): запись `Rename` в журнал прежнего адреса и журнал нового адреса (генезис с тем же
  // корнем и сертификат устройства) — одним запросом; прежний ник 30 дней ведёт на новый.
  rpc AccountRename(AccountRenameRequest) returns (AccountRenameResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.account.rename"
      channel: METHOD_CHANNEL_ID
      reauth: true
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc AccountChangePassword(AccountChangePasswordRequest) returns (AccountChangePasswordResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.account.change_password"
      channel: METHOD_CHANNEL_ID
      reauth: true
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }

  // ── ключ безопасности (правило SECKEY-1, spec 041): аппаратный ключ WebAuthn — второй фактор входа ──
  // Вызов для регистрации нового ключа (действует 5 минут, один на сессию).
  rpc SecKeyChallenge(SecKeyChallengeRequest) returns (SecKeyChallengeResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.seckey.challenge"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc SecKeyAdd(SecKeyAddRequest) returns (SecKeyAddResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.seckey.add"
      channel: METHOD_CHANNEL_ID
      reauth: true
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc SecKeyList(SecKeyListRequest) returns (SecKeyListResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.seckey.list"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc SecKeyRemove(SecKeyRemoveRequest) returns (SecKeyRemoveResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.seckey.remove"
      channel: METHOD_CHANNEL_ID
      reauth: true
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc SecKeySetRequired(SecKeySetRequiredRequest) returns (SecKeySetRequiredResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.seckey.set_required"
      channel: METHOD_CHANNEL_ID
      reauth: true
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }

  // ── линковка (LINK-1 v2) ──
  rpc LinkOffer(LinkOfferRequest) returns (LinkOfferResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.link.offer"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc LinkPoll(LinkPollRequest) returns (LinkPollResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.link.poll"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc LinkChallenge(LinkChallengeRequest) returns (LinkChallengeResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.link.challenge"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc LinkGrant(LinkGrantRequest) returns (LinkGrantResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.link.grant"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }

  // ── профиль и каталог ──
  rpc ProfileResolve(ProfileResolveRequest) returns (ProfileResolveResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.profile.resolve"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
      federated: true
    };
  }
  rpc ProfileSetName(ProfileSetNameRequest) returns (ProfileSetNameResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.profile.set_name"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc ProfileSetAvatar(ProfileSetAvatarRequest) returns (ProfileSetAvatarResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.profile.set_avatar"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc DirectorySearch(DirectorySearchRequest) returns (DirectorySearchResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.directory.search"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }

  // ── доступ к доставке и приватность ──
  rpc DeliveryKeySet(DeliveryKeySetRequest) returns (DeliveryKeySetResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.delivery_key.set"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }
  rpc TokensIssueBlinded(TokensIssueBlindedRequest) returns (TokensIssueBlindedResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.tokens.issue_blinded"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
      federated: true
    };
  }
  rpc TokensKeyList(TokensKeyListRequest) returns (TokensKeyListResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.tokens.key_list"
      channel: METHOD_CHANNEL_ANON
      rate: RATE_CLASS_ANON
      kind: METHOD_KIND_CALL
      shard: "identity"
      federated: true
    };
  }
  rpc PrivacySet(PrivacySetRequest) returns (PrivacySetResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.privacy.set"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }

  rpc PrivacyGet(PrivacyGetRequest) returns (PrivacyGetResponse) {
    option (parvane.core.v2.method) = {
      name: "identity.privacy.get"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
    };
  }

  // ── оператор ──
  rpc ServerStatsVersions(ServerStatsVersionsRequest) returns (ServerStatsVersionsResponse) {
    option (parvane.core.v2.method) = {
      name: "server.stats.versions"
      channel: METHOD_CHANNEL_ID
      rate: RATE_CLASS_REQ
      kind: METHOD_KIND_CALL
      shard: "identity"
      operator_only: true
    };
  }
}

// ── до входа ────────────────────────────────────────────────────────────────
// Правила v1 без изменений (argon2id, политика пароля, IP-лимиты, 2FA через
// Telegram, подтверждение почты/Telegram).

message SessionIssueRequest {
  // Ник или адрес.
  string login = 1 [(parvane.core.v2.max_len) = 255];
  string password = 2 [(parvane.core.v2.max_len) = 1024];
  // Устройство, для которого выпускается токен (claim dev обязателен).
  string device_id = 3 [(parvane.core.v2.max_len) = 64];
  // Второй шаг 2FA: токен входа, подтверждённый в Telegram.
  string login_token = 4 [(parvane.core.v2.max_len) = 128];
  // Секрет доверенного устройства (пропуск 2FA).
  string trust_secret = 5 [(parvane.core.v2.max_len) = 128];
  // Как устройство называет себя («Firefox, Linux») — подпись на экране
  // «Устройства» у владельца аккаунта.
  string client_kind = 6 [(parvane.core.v2.max_len) = 32];
  // ID-01: доказательство владения ключом устройства — подпись olm_ed25519 над
  // ("parvane/v2/session-proof\0", адрес, device_id, proof_ts_ms BE). Сервер
  // требует её для device_id, действующего в журнале устройств: пароль сам по
  // себе не даёт войти «как» чужое привязанное устройство (окно ±5 минут).
  bytes device_proof = 7 [(parvane.core.v2.max_len) = 64];
  int64 proof_ts_ms = 8;
  // Аккаунт ждёт удаления (spec 027): вход с этим флагом отменяет удаление; без него ответ несёт только
  // `deletion_at_ms` (сохранённый пароль другого устройства не отменяет удаление сам).
  bool cancel_deletion = 9;
  // SECKEY-1: ответ ключа безопасности на вызов из `SessionIssueResponse.seckey_challenge` (вход нового устройства на
  // аккаунт, где требуется ключ).
  SecKeyAssertion seckey = 10;
  // SECKEY-1: ключ безопасности потерян — вход нового устройства ключом восстановления вместо ключа безопасности
  // (сервер сверяет его с копией корня, как в RECOVER-2).
  string recovery_key = 11 [(parvane.core.v2.max_len) = 128];
}
message SessionIssueResponse {
  string token = 1 [(parvane.core.v2.max_len) = 4096];
  // Нужен второй фактор: подтвердить вход в Telegram и повторить с login_token.
  bool twofa_required = 2;
  string login_token = 3 [(parvane.core.v2.max_len) = 128];
  string telegram_bot = 4 [(parvane.core.v2.max_len) = 64];
  string trust_secret = 5 [(parvane.core.v2.max_len) = 128];
  // Аккаунт ждёт подтверждения (почта/Telegram): токена нет, клиент ведёт
  // пользователя на шаг подтверждения. Текста ошибок в протоколе нет, а кодом
  // FORBIDDEN этот случай не отличить от неверного пароля (T134).
  bool confirm_required = 6;
  // Адрес аккаунта, на который выписан токен (spec 026): после смены ника вход прежним ником 30 дней ведёт на
  // новый адрес — клиент переносит своё локальное под него.
  string address = 7 [(parvane.core.v2.max_len) = 128];
  // Аккаунт ждёт удаления (spec 027): когда всё будет стёрто; токена нет — повторить с `cancel_deletion`.
  int64 deletion_at_ms = 8;
  // spec 041: неверный логин или пароль — шаг входа, а не ошибка (клиент показывает, сколько попыток осталось).
  // Токена нет. Для несуществующего ника ответ тот же (анти-энумерация).
  bool password_wrong = 9;
  // Сколько неверных попыток осталось до временной блокировки входа (0 — блокировка уже идёт).
  uint32 attempts_left = 10;
  // Вход временно закрыт после серии неудач: через сколько миллисекунд можно повторить (0 — не закрыт).
  uint32 locked_ms = 11;
  // SECKEY-1: пароль верен, но новому устройству нужен ключ безопасности — токена нет. Повторить вход с
  // `SessionIssueRequest.seckey` (подпись этого вызова) либо с `recovery_key`. `trust_secret` в ответе сохраняется.
  bool seckey_required = 12;
  bytes seckey_challenge = 13 [(parvane.core.v2.max_len) = 64];
  // Ключи аккаунта (credential id) — `allowCredentials` для `navigator.credentials.get`.
  repeated bytes seckey_ids = 14 [
    (parvane.core.v2.max_items) = 16,
    (parvane.core.v2.max_len) = 1024
  ];
  string seckey_rp_id = 15 [(parvane.core.v2.max_len) = 255];
  // Ответ ключа был, но не принят (подпись, источник, счётчик, просроченный вызов) — новый вызов в этом ответе.
  bool seckey_rejected = 16;
  // Ключ восстановления был, но не подошёл.
  bool recovery_key_wrong = 17;
  // Вход ключом восстановления вместо ключа безопасности возможен (у аккаунта есть копия корня на сервере).
  bool seckey_recovery = 18;
}

// SECKEY-1: ответ аутентификатора WebAuthn (`AuthenticatorAssertionResponse`) — как отдал браузер.
message SecKeyAssertion {
  bytes credential_id = 1 [(parvane.core.v2.max_len) = 1024];
  bytes client_data_json = 2 [(parvane.core.v2.max_len) = 4096];
  bytes authenticator_data = 3 [(parvane.core.v2.max_len) = 4096];
  // ES256 — DER, Ed25519 — 64 байта.
  bytes signature = 4 [(parvane.core.v2.max_len) = 256];
}

// Продление: токен этого же устройства (подпись сервера обязательна, срок — нет,
// но не старше окна продления) и доказательство ключа устройства того же вида,
// что в `SessionIssueRequest` (адрес и device_id берутся из токена).
message SessionRenewRequest {
  string token = 1 [(parvane.core.v2.max_len) = 4096];
  bytes device_proof = 2 [(parvane.core.v2.max_len) = 64];
  int64 proof_ts_ms = 3;
}
message SessionRenewResponse {
  string token = 1 [(parvane.core.v2.max_len) = 4096];
}

message AccountRegisterRequest {
  string user = 1 [(parvane.core.v2.max_len) = 255];
  string password = 2 [(parvane.core.v2.max_len) = 1024];
  string invite = 3 [(parvane.core.v2.max_len) = 128];
  string email = 4 [(parvane.core.v2.max_len) = 255];
}
message AccountRegisterResponse {
  // Нужно подтверждение (почта или Telegram).
  bool confirm_required = 1;
  // Для подтверждения через Telegram: токен deep link и опроса статуса.
  string telegram_token = 2 [(parvane.core.v2.max_len) = 128];
}

message AccountConfirmEmailRequest {
  string user = 1 [(parvane.core.v2.max_len) = 255];
  string code = 2 [(parvane.core.v2.max_len) = 16];
}
message AccountConfirmEmailResponse {}

// Вызывает бот подтверждения (общий секрет).
message AccountConfirmTelegramRequest {
  string secret = 1 [(parvane.core.v2.max_len) = 256];
  string token = 2 [(parvane.core.v2.max_len) = 128];
  int64 telegram_id = 3;
  string telegram_name = 4 [(parvane.core.v2.max_len) = 128];
}
message AccountConfirmTelegramResponse {
  string user = 1 [(parvane.core.v2.max_len) = 255];
  // "registered" | "login" | …
  string action = 2 [(parvane.core.v2.max_len) = 32];
}

message AccountRegisterStatusRequest {
  string user = 1 [(parvane.core.v2.max_len) = 255];
  string token = 2 [(parvane.core.v2.max_len) = 128];
}
message AccountRegisterStatusResponse {
  bool confirmed = 1;
}

message ServerDescribeRequest {}
message ServerDescribeResponse {
  parvane.core.v2.SignedServerDescriptor descriptor = 1;
  // Способ подтверждения регистрации: пусто | "email" | "telegram".
  repeated string registration = 2 [
    (parvane.core.v2.max_items) = 8,
    (parvane.core.v2.max_len) = 32
  ];
  string domain = 3 [(parvane.core.v2.max_len) = 128];
  string telegram_bot = 4 [(parvane.core.v2.max_len) = 64];
  // Открытый ключ администратора для копии корня (X25519, HPKE): клиент
  // запечатывает им корень личности и отдаёт серверу шифртекст (RootBackupSet.escrow).
  // Закрытый ключ хранит администратор вне сервера; пусто — страховки нет.
  bytes escrow_public_key = 5 [(parvane.core.v2.max_len) = 32];
  // Открытый ключ администратора для жалоб (X25519, HPKE; spec 024). Пусто — жалобы серверу не принимаются.
  bytes report_public_key = 6 [(parvane.core.v2.max_len) = 32];
  // Модули, выключенные администратором для всех (spec 037, правило MODULES-1): идентификаторы из словаря
  // conformance (`planner`, `health`, `notes`, `files`, `music`). Клиент прячет такой модуль; неизвестный
  // идентификатор пропускает. Пусто — выключенных нет.
  repeated string disabled_modules = 7 [
    (parvane.core.v2.max_items) = 32,
    (parvane.core.v2.max_len) = 32
  ];
}

// Жалоба: `PVRP` ‖ версия ‖ enc(32) ‖ ct — JSON жалобы, запечатанный ключом администратора
// (`info = "parvane/v2/report\0" ‖ адрес автора`).
message ReportSubmitRequest {
  bytes sealed = 1 [(parvane.core.v2.max_len) = 262144];
}
message ReportSubmitResponse {}

// ── сессия ──────────────────────────────────────────────────────────────────

message SessionReauthRequest {
  string password = 1 [(parvane.core.v2.max_len) = 1024];
}
message SessionReauthResponse {
  // До какого момента методы с reauth разрешены этой сессии.
  int64 valid_until_ms = 1;
}

// ── устройства и корень ─────────────────────────────────────────────────────

// Одноразовый прекей Olm, подписанный ключом устройства.
message OneTimeKey {
  bytes key_id = 1 [(parvane.core.v2.max_len) = 16];
  bytes curve25519 = 2 [(parvane.core.v2.max_len) = 32];
  // Ed25519 устройства над "parvane/v2/otk\0" ‖ key_id ‖ curve25519.
  bytes signature = 3 [(parvane.core.v2.max_len) = 64];
  // spec 037 (план, номера не занимать другим): 4 — pq_kem (постквантовый предключ).
}

// Сертификат публикуется записью журнала устройств (add_device), подписанной
// SSK (D-11); прекеи — отдельно, подписаны ключом устройства.
message DevicePublishCertificateRequest {
  parvane.core.v2.SignedOp log_entry = 1;
  repeated OneTimeKey one_time_keys = 2 [(parvane.core.v2.max_items) = 100];
  // Резервный прекей (fallback), подписанный ключом устройства.
  OneTimeKey fallback_key = 3;
}
message DevicePublishCertificateResponse {
  uint32 one_time_keys_stored = 1;
}

message DeviceFetchBundleRequest {
  parvane.core.v2.UserRef user = 1;
}
message DeviceBundle {
  // spec 037 (план, номера не занимать другим): 4 — pq_last_resort.
  parvane.core.v2.SignedDeviceCertificate certificate = 1;
  // Выдаётся и расходуется атомарно; пусто → fallback_key.
  OneTimeKey one_time_key = 2;
  OneTimeKey fallback_key = 3;
}
message DeviceFetchBundleResponse {
  repeated DeviceBundle devices = 1 [(parvane.core.v2.max_items) = 64];
  // Легаси-устройства v1 (без сертификата) — только id; получают легаси-копии.
  repeated string legacy_device_ids = 2 [
    (parvane.core.v2.max_items) = 64,
    (parvane.core.v2.max_len) = 64
  ];
}

// Бандл по анонимному каналу (D-08): запрос бандла не выдаёт пару.
message DeviceFetchBundleAnonRequest {
  parvane.core.v2.UserRef user = 1;
}
message DeviceFetchBundleAnonResponse {
  repeated DeviceBundle devices = 1 [(parvane.core.v2.max_items) = 64];
}

message DeviceLogSyncRequest {
  parvane.core.v2.UserRef user = 1;
  uint64 after_version = 2;
  // Прежний (закрытый сменой ника) журнал по SHA-256 его первой записи (spec 026); пусто — текущий журнал.
  bytes genesis_hash = 3 [(parvane.core.v2.max_len) = 32];
}
message DeviceLogSyncResponse {
  // Записи журнала устройств — SignedOp c payload UserDeviceLogEntry.
  repeated parvane.core.v2.SignedOp entries = 1 [(parvane.core.v2.max_items) = 256];
  bool more = 2;
  // SHA-256 первой записи текущего журнала (пусто — журнала нет). Клиент,
  // знающий другой генезис, видит, что журнал начат заново (смена корня,
  // KEY-1 v2), и перечитывает его с версии 0.
  bytes genesis_hash = 3 [(parvane.core.v2.max_len) = 32];
  // Аккаунт удалён либо ждёт удаления (spec 027): журнала нет, собеседник показывает «Удалённый аккаунт».
  bool deleted = 4;
}
message DeviceLogSyncAnonRequest {
  parvane.core.v2.UserRef user = 1;
  uint64 after_version = 2;
  // Как в DeviceLogSyncRequest (spec 026).
  bytes genesis_hash = 3 [(parvane.core.v2.max_len) = 32];
}
message DeviceLogSyncAnonResponse {
  repeated parvane.core.v2.SignedOp entries = 1 [(parvane.core.v2.max_items) = 256];
  bool more = 2;
  // Как в DeviceLogSyncResponse.
  bytes genesis_hash = 3 [(parvane.core.v2.max_len) = 32];
  // Аккаунт удалён либо ждёт удаления (spec 027): журнала нет, собеседник показывает «Удалённый аккаунт».
  bool deleted = 4;
}

message DeviceLogAppendRequest {
  parvane.core.v2.SignedOp entry = 1;
}
message DeviceLogAppendResponse {
  uint64 version = 1;
}

message DeviceListRequest {}
message DeviceInfo {
  string device_id = 1 [(parvane.core.v2.max_len) = 64];
  bool legacy = 2;
  bool revoked = 3;
  int64 created_ms = 4;
  int64 last_seen_ms = 5;
  string client_kind = 6 [(parvane.core.v2.max_len) = 32];
  uint32 proto_major = 7;
  uint32 proto_minor = 8;
}
message DeviceListResponse {
  repeated DeviceInfo devices = 1 [(parvane.core.v2.max_items) = 64];
}

message DeviceRevokeRequest {
  string device_id = 1 [(parvane.core.v2.max_len) = 64];
}
message DeviceRevokeResponse {}

// Смена корня = новый журнал устройств (генезис, подписанный новым корнем);
// собеседники видят предупреждение KEY-1.
message RootRotateRequest {
  parvane.core.v2.SignedOp genesis = 1;
}
message RootRotateResponse {}

message RootBackupSetRequest {
  // Копия корня под ключом восстановления (recovery.rs export_root_backup).
  bytes backup = 1 [(parvane.core.v2.max_len) = 1024];
  // Копия корня, запечатанная ключом администратора сервера
  // (recovery.rs seal_root_escrow): страховка на случай, когда потеряны и
  // устройства, и ключ восстановления. Сервер без закрытого ключа администратора
  // её не читает. Пусто — прежняя копия у сервера не меняется.
  bytes escrow = 2 [(parvane.core.v2.max_len) = 256];
  // spec 015: копия ключей аккаунта под ключом восстановления (материал
  // привязки устройства, ключи планировщика, указатель на снимок истории) —
  // шифртекст клиента. С ней новое устройство входит в журнал устройств по
  // одному ключу восстановления, прежние устройства остаются. Можно слать без
  // `backup`; пусто — прежняя копия у сервера не меняется.
  bytes key_bundle = 3 [(parvane.core.v2.max_len) = 262144];
}
message RootBackupSetResponse {}
message RootBackupGetRequest {}
message RootBackupGetResponse {
  // Пусто — копии на сервере нет.
  bytes backup = 1 [(parvane.core.v2.max_len) = 1024];
  // У сервера есть копия корня для администратора (RootBackupSet.escrow) —
  // потерянный ключ восстановления можно выписать заново.
  bool has_escrow = 2;
  // Копия ключей аккаунта (RootBackupSet.key_bundle); пусто — нет.
  bytes key_bundle = 3 [(parvane.core.v2.max_len) = 262144];
  // К аккаунту привязан Telegram и сервер работает с ботом: ключ восстановления
  // можно отправить в чат с ботом и ввести ответом боту.
  bool telegram = 4;
}

// Действующее устройство: отправить ключ восстановления в Telegram владельца.
message RecoveryTgSendRequest {
  string recovery_key = 1 [(parvane.core.v2.max_len) = 64];
}
message RecoveryTgSendResponse {}

// Новое устройство (вход по паролю, в журнале его ещё нет): попросить бота
// спросить ключ восстановления у владельца.
message RecoveryTgRequestRequest {
  // Подпись устройства для текста бота («Chrome, Android»).
  string client = 1 [(parvane.core.v2.max_len) = 64];
  // Владелец просит прислать сообщение ещё раз. Без этого повторный запрос
  // того же устройства, пока прежний ждёт ответа, новое сообщение не шлёт.
  bool again = 2;
  // A0023-1: эфемерный открытый ключ X25519 устройства (ровно 32 байта, S7-1: без него —
  // INVALID). Ответ владельца запечатывается на него (`RecoveryTgPollResponse.sealed_key`).
  // Запрос привязан к сессии (JWT), которая его завела: другая сессия с тем же
  // `device_id` и другим ключом получает FORBIDDEN, замены запроса нет.
  bytes eph_public = 3 [(parvane.core.v2.max_len) = 32];
}
message RecoveryTgRequestResponse {
  // Короткий код сверки (6 цифр, назначает сервер). Бот показывает владельцу тот же код
  // в просьбе ответить ключом; владелец отвечает только на сообщение с кодом своего экрана.
  string code = 1 [(parvane.core.v2.max_len) = 16];
}

message RecoveryTgPollRequest {
  // Ключ получен и применён — стереть его на сервере.
  bool done = 1;
}
message RecoveryTgPollResponse {
  // Только действующему устройству журнала аккаунта без копии ключей (завести копию);
  // запросившему новому устройству — всегда пусто (ответ — `sealed_key`).
  string recovery_key = 1 [(parvane.core.v2.max_len) = 64];
  // Запрос ещё ждёт ответа (false — истёк или не создавался).
  bool pending = 2;
  // Ответ владельца, запечатанный на `eph_public` запроса (`enc ‖ шифртекст`, см.
  // `parvane_protocol::recovery_tg`); пусто — владелец ещё не ответил либо запрос без ключа.
  bytes sealed_key = 3 [(parvane.core.v2.max_len) = 128];
  // Код сверки запроса (как в сообщении бота). Опрос видит только сессия, заведшая запрос.
  // Клиент НЕ заменяет им уже показанный код: другой код — запрос перехвачен (S7-1),
  // ответа не ждать.
  string code = 4 [(parvane.core.v2.max_len) = 16];
}

message TelegramOutMessage {
  uint64 id = 1;
  int64 telegram_id = 2;
  // "key" — сообщение с ключом восстановления; "ask" — просьба ответить ключом.
  string kind = 3 [(parvane.core.v2.max_len) = 16];
  string user = 4 [(parvane.core.v2.max_len) = 255];
  string recovery_key = 5 [(parvane.core.v2.max_len) = 64];
  string client = 6 [(parvane.core.v2.max_len) = 64];
  // Для "ask": номер запроса устройства и код сверки с экрана устройства. Бот
  // возвращает номер в ответе, чтобы ключ достался именно этому устройству.
  uint64 request_id = 7;
  string code = 8 [(parvane.core.v2.max_len) = 16];
}
message TelegramPullRequest {
  string secret = 1 [(parvane.core.v2.max_len) = 256];
  // Сообщения, уже доставленные в Telegram (id из прошлого ответа).
  repeated uint64 ack = 2 [(parvane.core.v2.max_items) = 64];
  // Сколько ждать появления сообщений, мс (не больше 8000).
  uint32 wait_ms = 3;
}
message TelegramPullResponse {
  repeated TelegramOutMessage messages = 1 [(parvane.core.v2.max_items) = 64];
}
message TelegramReplyRequest {
  string secret = 1 [(parvane.core.v2.max_len) = 256];
  int64 telegram_id = 2;
  string text = 3 [(parvane.core.v2.max_len) = 256];
  // Номер запроса из сообщения бота ("ask"), на которое ответил владелец. 0 — старый бот:
  // принимается, только если у аккаунта ровно один живой запрос.
  uint64 request_id = 4;
}
message TelegramReplyResponse {
  // "ok" | "bad_key" | "no_request" | "no_account"
  string result = 1 [(parvane.core.v2.max_len) = 16];
  string user = 2 [(parvane.core.v2.max_len) = 255];
}

// ── аккаунт ─────────────────────────────────────────────────────────────────

// 2FA через Telegram (как v1). Без enabled — только прочитать состояние.
message AccountSet2faRequest {
  optional bool enabled = 1;
  string password = 2 [(parvane.core.v2.max_len) = 1024];
}
// Те же номера полей, что у AccountSet2faResponse (без trust_secret): прежние
// клиенты читают ответ как раньше.
message AccountGet2faResponse {
  bool enabled = 1;
  bool telegram_linked = 2;
  string telegram_bot = 3 [(parvane.core.v2.max_len) = 64];
}
message AccountSet2faResponse {
  bool enabled = 1;
  bool telegram_linked = 2;
  string telegram_bot = 3 [(parvane.core.v2.max_len) = 64];
  // Секрет доверия устройству, включившему 2FA: следующий вход с него — без
  // подтверждения в Telegram (как SessionIssueResponse.trust_secret).
  string trust_secret = 4 [(parvane.core.v2.max_len) = 128];
}

// Состояние второго фактора — чтение без свежего пароля (экран настроек
// показывает переключатель до того, как пользователь что-то меняет).
message AccountGet2faRequest {}

message AccountChangePasswordRequest {
  string old_password = 1 [(parvane.core.v2.max_len) = 1024];
  string new_password = 2 [(parvane.core.v2.max_len) = 1024];
}
message AccountChangePasswordResponse {}

// ── ключ безопасности (SECKEY-1) ──
// Заводят и снимают ключи только устройства журнала (действующие); добавление, удаление и выключатель — со
// свежим паролем. Первый ключ включает «Требовать ключ при входе»; ключ нельзя добавить, пока у аккаунта нет
// копии корня на сервере (иначе потеря ключа запирала бы вход новых устройств).
message SecKeyChallengeRequest {}
message SecKeyChallengeResponse {
  bytes challenge = 1 [(parvane.core.v2.max_len) = 64];
  // rpId WebAuthn сервера (`PARVANE_WEBAUTHN_RP_ID`, по умолчанию домен сервера).
  string rp_id = 2 [(parvane.core.v2.max_len) = 255];
  // `user.id` для `navigator.credentials.create` (непрозрачный, из адреса аккаунта).
  bytes user_handle = 3 [(parvane.core.v2.max_len) = 64];
  // Уже заведённые ключи — `excludeCredentials`.
  repeated bytes exclude_ids = 4 [
    (parvane.core.v2.max_items) = 16,
    (parvane.core.v2.max_len) = 1024
  ];
}
// Ответ `navigator.credentials.create` (attestation «none»): ключ и credential id сервер берёт из
// `authenticator_data` (attested credential data), вызов и источник — из `client_data_json`.
message SecKeyAddRequest {
  string name = 1 [(parvane.core.v2.max_len) = 64];
  bytes client_data_json = 2 [(parvane.core.v2.max_len) = 4096];
  bytes authenticator_data = 3 [(parvane.core.v2.max_len) = 4096];
}
message SecKeyInfo {
  bytes credential_id = 1 [(parvane.core.v2.max_len) = 1024];
  string name = 2 [(parvane.core.v2.max_len) = 64];
  int64 created_ms = 3;
  // 0 — ещё не использовался для входа.
  int64 last_used_ms = 4;
  // COSE: -7 (ES256) | -8 (EdDSA).
  int32 alg = 5;
}
message SecKeyAddResponse {
  SecKeyInfo key = 1;
}
message SecKeyListRequest {}
message SecKeyListResponse {
  repeated SecKeyInfo keys = 1 [(parvane.core.v2.max_items) = 16];
  // «Требовать ключ при входе» (действует, только пока есть хоть один ключ).
  bool required = 2;
  // У аккаунта есть копия корня на сервере — можно добавить ключ (вход без него — ключом восстановления).
  bool recovery_ready = 3;
}
message SecKeyRemoveRequest {
  bytes credential_id = 1 [(parvane.core.v2.max_len) = 1024];
}
message SecKeyRemoveResponse {}
message SecKeySetRequiredRequest {
  bool required = 1;
}
message SecKeySetRequiredResponse {}

message AccountDeleteRequest {}
message AccountDeleteResponse {
  // Когда аккаунт будет стёрт окончательно.
  int64 deletion_at_ms = 1;
}

message AccountRenameRequest {
  string new_login = 1 [(parvane.core.v2.max_len) = 64];
  parvane.core.v2.SignedOp rename = 2;
  repeated parvane.core.v2.SignedOp new_log = 3 [(parvane.core.v2.max_items) = 8];
  // Копия корня под ключом восстановления, привязанная к новому адресу (прежняя открывается только под
  // прежним): сервер заменяет ею копию аккаунта в той же транзакции.
  bytes root_backup = 4 [(parvane.core.v2.max_len) = 1024];
}
message AccountRenameResponse {
  // JWT нового адреса (прежний недействителен).
  string token = 1 [(parvane.core.v2.max_len) = 4096];
  string address = 2 [(parvane.core.v2.max_len) = 128];
}

// ── линковка (LINK-1 v2) ────────────────────────────────────────────────────
// Смысл LINK-1 сохраняется: обязательство, challenge, SAS 12 цифр от пары
// ключей, грант только на ключ challenge. Форматы полей — как в v1 (base64/hex
// строки), чтобы правила проверки LINK-1 не менялись. Результат — сертификат нового
// устройства (запись журнала устройств, подписанная SSK) и ключ личного
// состояния внутри зашифрованного гранта. Устройство — из сессии.

message LinkOfferRequest {
  // Эфемерный ключ нового устройства (P-256, несжатый).
  string eph_pub = 1 [(parvane.core.v2.max_len) = 512];
  // Обязательство (SHA-256 ключа challenge).
  string commitment = 2 [(parvane.core.v2.max_len) = 512];
  string signing_key = 3 [(parvane.core.v2.max_len) = 512];
  // Отозвать своё предложение.
  bool revoke = 4;
  // spec 037 (план, номера не занимать другим): 5 — kem_pub (гибридная привязка устройства).
}
message LinkOfferResponse {}

message LinkOffer {
  string device_id = 1 [(parvane.core.v2.max_len) = 64];
  string eph_pub = 2 [(parvane.core.v2.max_len) = 512];
  string commitment = 3 [(parvane.core.v2.max_len) = 512];
  string signing_key = 4 [(parvane.core.v2.max_len) = 512];
  int64 created_ms = 5;
  string challenge_pub = 6 [(parvane.core.v2.max_len) = 512];
  // LINK-1 п. 13: закрытая часть ключа challenge, зашифрованная ключом из SSK аккаунта (base64). Другие старые
  // устройства с тем же SSK открывают её, показывают тот же код сверки и могут выдать грант.
  string challenge_wrap = 7 [(parvane.core.v2.max_len) = 512];
}

message LinkGrant {
  string from_device_id = 1 [(parvane.core.v2.max_len) = 64];
  string box_payload = 2 [(parvane.core.v2.max_len) = 131072];
  string eph_pub = 3 [(parvane.core.v2.max_len) = 512];
}

message LinkPollRequest {}
message LinkPollResponse {
  // Предложения других устройств (видит старое устройство).
  repeated LinkOffer offers = 1 [(parvane.core.v2.max_items) = 16];
  // Грант для этого устройства (видит новое).
  LinkGrant grant = 2;
  // Ключ challenge старого устройства для этого устройства.
  string challenge = 3 [(parvane.core.v2.max_len) = 512];
}

message LinkChallengeRequest {
  // Целевое (новое) устройство.
  string device_id = 1 [(parvane.core.v2.max_len) = 64];
  string eph_pub = 2 [(parvane.core.v2.max_len) = 512];
  // LINK-1 п. 13: обёртка закрытой части eph_pub для своих устройств (см. LinkOffer.challenge_wrap).
  string wrap = 3 [(parvane.core.v2.max_len) = 512];
}
message LinkChallengeResponse {}

message LinkGrantRequest {
  string device_id = 1 [(parvane.core.v2.max_len) = 64];
  // Шифртекст на ключ challenge: сертификат нового устройства + ключ состояния.
  string box_payload = 2 [(parvane.core.v2.max_len) = 131072];
  string eph_pub = 3 [(parvane.core.v2.max_len) = 512];
}
message LinkGrantResponse {}

// ── профиль и каталог ───────────────────────────────────────────────────────

// Публичная карточка: без телефона и почты.
message PublicProfile {
  parvane.core.v2.UserRef user = 1;
  string display_name = 2 [(parvane.core.v2.max_len) = 128];
  string avatar_file_id = 3 [(parvane.core.v2.max_len) = 64];
  // Корневой ключ — для TOFU (KEY-1 v2); пусто у пользователя без v2.
  bytes root_key = 4 [(parvane.core.v2.max_len) = 32];
  string bio = 5 [(parvane.core.v2.max_len) = 512];
  string birthday = 6 [(parvane.core.v2.max_len) = 32];
  // Не задан — цвет имени не выбран (0 — действительный индекс цвета).
  optional int64 name_color = 7;
  string personal_channel = 8 [(parvane.core.v2.max_len) = 128];
  // Телефон профиля — только в ответе самому владельцу (P-19).
  string phone = 9 [(parvane.core.v2.max_len) = 32];
}

message ProfileResolveRequest {
  repeated parvane.core.v2.UserRef users = 1 [(parvane.core.v2.max_items) = 100];
}
message ProfileResolveResponse {
  repeated PublicProfile profiles = 1 [(parvane.core.v2.max_items) = 100];
}

// Поле не задано (optional) — не менять.
message ProfileSetNameRequest {
  string display_name = 1 [(parvane.core.v2.max_len) = 128];
  optional string bio = 2 [(parvane.core.v2.max_len) = 512];
  optional string birthday = 3 [(parvane.core.v2.max_len) = 32];
  optional int64 name_color = 4;
  optional string personal_channel = 5 [(parvane.core.v2.max_len) = 128];
  // Телефон виден только владельцу (в публичную карточку не попадает).
  optional string phone = 6 [(parvane.core.v2.max_len) = 32];
}
message ProfileSetNameResponse {}

message ProfileSetAvatarRequest {
  string avatar_file_id = 1 [(parvane.core.v2.max_len) = 64];
}
message ProfileSetAvatarResponse {}

message DirectorySearchRequest {
  // Точное имя/префикс, без wildcard.
  string query = 1 [(parvane.core.v2.max_len) = 128];
}
message DirectorySearchResponse {
  repeated PublicProfile results = 1 [(parvane.core.v2.max_items) = 50];
}

// ── доступ к доставке и приватность ─────────────────────────────────────────

message DeliveryKeySetRequest {
  // Сервер хранит только SHA-256.
  bytes delivery_key = 1 [(parvane.core.v2.max_len) = 32];
}
message DeliveryKeySetResponse {}

message TokensIssueBlindedRequest {
  // Ослеплённые сообщения; ≤ 50 жетонов в сутки на аккаунт.
  repeated bytes blinded = 1 [
    (parvane.core.v2.max_items) = 50,
    (parvane.core.v2.max_len) = 512
  ];
}
message TokensIssueBlindedResponse {
  // key_id = SHA-256(SPKI); клиент сверяет со списком, полученным анонимно (D-06).
  bytes key_id = 1 [(parvane.core.v2.max_len) = 32];
  bytes public_key = 2 [(parvane.core.v2.max_len) = 1024];
  repeated bytes blind_signatures = 3 [
    (parvane.core.v2.max_items) = 50,
    (parvane.core.v2.max_len) = 512
  ];
}

message TokensKeyListRequest {}
message TokensKeyListResponse {
  parvane.core.v2.SignedTokenKeyList list = 1;
}

enum Audience {
  AUDIENCE_UNSPECIFIED = 0;
  AUDIENCE_EVERYBODY = 1;
  AUDIENCE_CONTACTS = 2;
  AUDIENCE_NOBODY = 3;
}

// Явные серверные поля приватности (FR-040).
message PrivacySettings {
  Audience group_add = 1;
  bool messages_from_strangers = 2;
  Audience calls_from = 3;
  Audience presence_visibility = 4;
}
message PrivacySetRequest {
  PrivacySettings settings = 1;
}
message PrivacySetResponse {}
// Свои настройки приватности (FR-040): устройство читает их при запуске, чтобы
// настройка, заданная на другом устройстве, не перетиралась локальной.
message PrivacyGetRequest {}
message PrivacyGetResponse {
  PrivacySettings settings = 1;
  // false — настройки ни разу не задавались (в settings значения по умолчанию).
  bool is_set = 2;
}

// ── оператор ────────────────────────────────────────────────────────────────

message VersionCount {
  uint32 proto_major = 1;
  uint32 proto_minor = 2;
  string client_kind = 3 [(parvane.core.v2.max_len) = 16];
  uint64 devices = 4;
}
message ServerStatsVersionsRequest {}
message ServerStatsVersionsResponse {
  repeated VersionCount versions = 1 [(parvane.core.v2.max_items) = 256];
  uint64 legacy_devices = 2;
}
