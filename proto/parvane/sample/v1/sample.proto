// Тестовый домен каркаса (SC-005, T093): LWW-карта key → value, без UI и
// клиентов. Контейнер с domain = "sample.v1"; открытый текст ContainerOp —
// SampleOp, открытый текст Snapshot — SampleSnapshot. Сведение детерминировано:
// у каждого ключа побеждает запись с большей меткой (lamport, device_id),
// при равенстве — большая пара (deleted, value) (backend/protocol/src/domain.rs,
// LwwMap). Метка не может обогнать виденный максимум больше чем на 2^20 (D-16).
syntax = "proto3";

package parvane.sample.v1;

import "parvane/core/v2/domain.proto";
import "parvane/core/v2/options.proto";

message SampleEntry {
  string key = 1 [(parvane.core.v2.max_len) = 256];
  bytes value = 2 [(parvane.core.v2.max_len) = 4096];
  // Удаление ключа (надгробие; value пусто).
  bool deleted = 3;
  parvane.core.v2.LwwStamp stamp = 4;
}

// Одна операция журнала: пакет записей одного устройства.
message SampleOp {
  repeated SampleEntry entries = 1 [(parvane.core.v2.max_items) = 64];
}

// Снимок: все ключи (с надгробиями) на момент upto_seq.
message SampleSnapshot {
  repeated SampleEntry entries = 1 [(parvane.core.v2.max_items) = 4096];
}

// ── «Движок будущего» (spec 035, T025) ───────────────────────────────────────
// Надмножества сообщений выпуска для круга совместимости «движок будущего → движок выпуска → движок
// будущего» (FR-034): те же номера и типы полей, что у `parvane.msg.v2.Content`/`Text`/`Entity`, плюс
// новое вложенное поле, новый обычный вид, критичный вид (диапазон 1000–1999) и новое значение enum.
// Только для тестов движка (cargo-feature `future-schema`); клиенты эти типы не используют. Номер
// вида ≥ 1000 разрешён `build.rs` только в этом пакете.

enum FutureEntityType {
  FUTURE_ENTITY_TYPE_UNSPECIFIED = 0;
  FUTURE_ENTITY_TYPE_BOLD = 1;
  FUTURE_ENTITY_TYPE_ITALIC = 2;
  // Новое значение enum (в `parvane.msg.v2.EntityType` его нет).
  FUTURE_ENTITY_TYPE_SPARKLE = 900;
}

// Как `parvane.msg.v2.Entity` (поля 1–3) + новое поле.
message FutureEntity {
  FutureEntityType type = 1;
  uint32 offset = 2;
  uint32 length = 3;
  // Новое вложенное поле (глубина 3 от FutureContent).
  string future_note = 50 [(parvane.core.v2.max_len) = 256];
}

// Как `parvane.msg.v2.Text` (поля 1–2) + новое поле.
message FutureText {
  string text = 1 [(parvane.core.v2.max_len) = 65536];
  repeated FutureEntity entities = 2 [(parvane.core.v2.max_items) = 1024];
  uint32 future_level = 60;
}

// Новый обычный вид содержимого.
message FutureNormal {
  string label = 1 [(parvane.core.v2.max_len) = 256];
}

// Новый критичный вид: старый движок не вправе отвечать/править/пересылать (STUB_CRITICAL).
message FutureCritical {
  bytes secret_rule = 1 [(parvane.core.v2.max_len) = 256];
}

// Как `parvane.msg.v2.Content` (вид text = 1, ttl_secs = 100) + новые виды.
message FutureContent {
  oneof kind {
    FutureText text = 1;
    FutureNormal future_normal = 900;
    FutureCritical future_critical = 1000;
  }
  uint32 ttl_secs = 100;
}
