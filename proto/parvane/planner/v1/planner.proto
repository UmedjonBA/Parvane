// Домен планировщика (spec 010, R2/R3): контейнер `parvane.planner.v1` — один на
// пользователя, содержимое — открытый текст операций и снимков каркаса доменов
// (core/v2/domain.proto), AEAD ключа эпохи; сервер видит только шифртекст.
//
// Сведение — «последняя правка побеждает» по полям объекта: у каждого поля своя
// метка LwwStamp (lamport, device_id); при равных метках порядок добивается
// хэшем байтов изменения (backend/protocol/src/domain/planner.rs). Удаление —
// надгробие `deleted` с меткой: правка со старшей меткой воскрешает объект,
// с младшей — игнорируется. Запись питания (FoodEntry) сливается целиком по
// `stamp`. Метка не может обогнать виденный максимум больше чем на 2^20 (D-16).
syntax = "proto3";

package parvane.planner.v1;

import "parvane/core/v2/domain.proto";
import "parvane/core/v2/options.proto";

// ── LWW-регистры полей ──────────────────────────────────────────────────────

// Строковое поле; пустая строка — «не задано» (дата, время, список).
message Str {
  parvane.core.v2.LwwStamp stamp = 1;
  string value = 2 [(parvane.core.v2.max_len) = 4000];
}

// Беззнаковое поле; `unset` — значения нет (оценка задачи «без оценки»).
message U32 {
  parvane.core.v2.LwwStamp stamp = 1;
  uint32 value = 2;
  bool unset = 3;
}

message I32 {
  parvane.core.v2.LwwStamp stamp = 1;
  int32 value = 2;
}

message Bool {
  parvane.core.v2.LwwStamp stamp = 1;
  bool value = 2;
}

message Step {
  string text = 1 [(parvane.core.v2.max_len) = 160];
  bool is_done = 2;
}

// Шаги задачи — список целиком под одной меткой.
message Steps {
  parvane.core.v2.LwwStamp stamp = 1;
  repeated Step items = 2 [(parvane.core.v2.max_items) = 100];
}

// Дни недели повтора события (0 — воскресенье, как Date.getDay).
// Унаследованный вид повтора (этапы 1–2): при чтении без `repeat` трактуется как
// еженедельный ряд без нижней границы (spec 011, R5); новые правки пишут `repeat`.
message Weekdays {
  parvane.core.v2.LwwStamp stamp = 1;
  repeated uint32 days = 2 [(parvane.core.v2.max_items) = 7];
}

// ── повторы (spec 011) ──────────────────────────────────────────────────────

enum RepeatKind {
  REPEAT_KIND_UNSPECIFIED = 0;
  REPEAT_KIND_DAILY = 1;
  REPEAT_KIND_WEEKLY = 2;
  REPEAT_KIND_MONTHLY = 3;
  REPEAT_KIND_YEARLY = 4;
}

// Правило повтора — регистр целиком под одной меткой. Хранится правило, а не
// экземпляры: даты разворачивает клиент (research R1/R4). `kind = NONE` или
// отсутствие регистра — разовое дело.
message Repeat {
  parvane.core.v2.LwwStamp stamp = 1;
  RepeatKind kind = 2;
  // шаг: каждые N дней/недель/месяцев/лет, 1..99
  uint32 interval = 3;
  // WEEKLY: дни недели (0 — воскресенье)
  repeated uint32 weekdays = 4 [(parvane.core.v2.max_items) = 7];
  // MONTHLY: число месяца 1..31; 0 — число start_day; в коротком месяце —
  // последний день
  uint32 month_day = 5;
  // первый возможный экземпляр YYYY-MM-DD; пусто — без нижней границы
  // (только унаследованные ряды по дням недели)
  string start_day = 6 [(parvane.core.v2.max_len) = 10];
  // конец ряда: до даты включительно и/или после count повторов; 0/пусто — нет
  string end_day = 7 [(parvane.core.v2.max_len) = 10];
  uint32 count = 8;
}

// Состояние экземпляра ряда в день `day` — регистр дня целиком: отметки разных
// дней с двух устройств объединяются, внутри дня побеждает поздняя (R2).
message Occurrence {
  string day = 1 [(parvane.core.v2.max_len) = 10];
  parvane.core.v2.LwwStamp stamp = 2;
  // экземпляра в этот день нет (удалён «только это» или отделён)
  bool excluded = 3;
  // задача-ряд выполнена в этот день
  bool done = 4;
  // индексы отмеченных шагов в этот день
  repeated uint32 done_steps = 5 [(parvane.core.v2.max_items) = 100];
}

// Откуда отделён экземпляр («изменить только это»): информационно, у ряда на
// этот день стоит `excluded`.
message Origin {
  parvane.core.v2.LwwStamp stamp = 1;
  string series_id = 2 [(parvane.core.v2.max_len) = 64];
  string day = 3 [(parvane.core.v2.max_len) = 10];
}

// Задание из чата, из которого создана задача (защита от дубля на втором
// устройстве и переход «карточка → задача»): адрес чата и op_id сообщения.
message Source {
  parvane.core.v2.LwwStamp stamp = 1;
  string chat = 2 [(parvane.core.v2.max_len) = 128];
  string op_id = 3 [(parvane.core.v2.max_len) = 32];
}

// ── объекты ─────────────────────────────────────────────────────────────────

// Идентификаторы объектов — UUIDv7 в hex либо `legacy-<устройство>-<n>` для
// переноса данных этапа 1 (R3); уникальны между устройствами.
message Task {
  string id = 1 [(parvane.core.v2.max_len) = 64];
  Str name = 2;
  Str description = 3;
  Steps steps = 4;
  // queue | active | later | waiting | done
  Str status = 5;
  // id списка; пустая строка — «без списка»
  Str list_id = 6;
  I32 rank = 7;
  // YYYY-MM-DD, HH:MM, YYYY-MM-DD; пустая строка — не задано
  Str day = 8;
  Str start = 9;
  Str due = 10;
  // минуты оценки; unset — без оценки
  U32 minutes = 11;
  // надгробие
  parvane.core.v2.LwwStamp deleted = 12;
  // spec 011: повтор, состояние экземпляров, откуда отделена, из какого задания
  Repeat repeat = 13;
  repeated Occurrence occurrences = 14 [(parvane.core.v2.max_items) = 2000];
  Origin origin = 15;
  Source source = 16;
  // 15 окт 2026, этап 4 плана: напомнить за столько минут до начала (без времени — до начала дня окна);
  // unset — без напоминания. Не больше недели
  U32 remind = 17;
}

message Event {
  string id = 1 [(parvane.core.v2.max_len) = 64];
  Str name = 2;
  Str start = 3;
  Str end = 4;
  Weekdays weekdays = 5;
  // разовая дата YYYY-MM-DD; пусто — повтор по дням недели
  Str day = 6;
  parvane.core.v2.LwwStamp deleted = 7;
  // spec 011: у события используется только `excluded` экземпляров
  Repeat repeat = 8;
  repeated Occurrence occurrences = 9 [(parvane.core.v2.max_items) = 2000];
  Origin origin = 10;
  // spec 013: событие на весь день (время хранится 00:00–23:59, клиент его не показывает)
  Bool all_day = 11;
  // spec 013: праздник — день события отмечается в календаре
  Bool is_holiday = 12;
  // Цвет события из палитры клиента, как у списка (0 — без цвета): событие в список
  // не входит, поэтому цвет у него свой
  U32 color = 13;
  // 12 окт 2026: описание события, как у задачи (пустая строка — нет); название — короткая
  // строка для календаря, подробности — здесь
  Str description = 14;
  // 15 окт 2026: напомнить за столько минут до начала, как у задачи
  U32 remind = 15;
}

message List {
  string id = 1 [(parvane.core.v2.max_len) = 64];
  Str name = 2;
  I32 order = 3;
  parvane.core.v2.LwwStamp deleted = 4;
  // spec 013: цвет списка — 0 нет, 1…8 индекс палитры клиента
  U32 color = 5;
}

message Goal {
  uint32 target = 1;
  uint32 tolerance = 2;
  // цель по показателю задана (GoalPeriod); в GoalSet задана ⇔ target > 0
  bool set = 3;
}

// Цели по калориям, БЖУ, клетчатке и воде — под одной меткой. С spec 011 —
// запись «с самого начала» с самым низким приоритетом (research R6).
message GoalSet {
  parvane.core.v2.LwwStamp stamp = 1;
  Goal kcal = 2;
  Goal protein = 3;
  Goal fat = 4;
  Goal carbs = 5;
  Goal fiber = 6;
  // вода — мл
  Goal water = 7;
}

// Запись цели с датами (spec 011): регистр целиком по `stamp`, надгробие.
// Для дня действует накрывающая запись: позже начатая, затем короче, затем
// позже изменённая; пусто в end_day — бессрочно, пусто в start_day — с начала.
message GoalPeriod {
  string id = 1 [(parvane.core.v2.max_len) = 64];
  parvane.core.v2.LwwStamp stamp = 2;
  string start_day = 3 [(parvane.core.v2.max_len) = 10];
  string end_day = 4 [(parvane.core.v2.max_len) = 10];
  Goal kcal = 5;
  Goal protein = 6;
  Goal fat = 7;
  Goal carbs = 8;
  Goal fiber = 9;
  Goal water = 10;
  parvane.core.v2.LwwStamp deleted = 11;
}

// Запись дневника питания — LWW-регистр целиком.
message FoodEntry {
  string id = 1 [(parvane.core.v2.max_len) = 64];
  parvane.core.v2.LwwStamp stamp = 2;
  string name = 3 [(parvane.core.v2.max_len) = 120];
  // breakfast | lunch | dinner | snack | other
  string meal = 4 [(parvane.core.v2.max_len) = 16];
  double kcal = 5;
  double protein = 6;
  double fat = 7;
  double carbs = 8;
  double fiber = 9;
  double grams = 10;
  // Битовая маска известных значений: 1 kcal, 2 protein, 4 fat, 8 carbs,
  // 16 fiber, 32 grams. Неизвестное не равно нулю.
  uint32 known = 11;
  bool per100 = 12;
  parvane.core.v2.LwwStamp deleted = 13;
  // spec 020: сахар и соль (граммы; биты `known` 64 и 128) и время приёма `HH:MM` (пусто — не задано).
  double sugar = 14;
  double salt = 15;
  string time = 16 [(parvane.core.v2.max_len) = 5];
}

// Запись здоровья (spec 020): регистр целиком по `stamp`, надгробие. Вид записи — строка, чтобы новый
// показатель не требовал смены схемы: weight (value — кг), pressure (value / value2 — верхнее и нижнее),
// pulse, steps, mood (1…5), sleep (time — лёг, end_time — встал, value — минуты), workout (time, value —
// минуты, value2 — километры, name, details — упражнения), goals (одна запись с целями здоровья в details).
// Незнакомый вид клиент хранит и не показывает. `details` — JSON, движок его не разбирает.
message HealthRecord {
  string id = 1 [(parvane.core.v2.max_len) = 64];
  parvane.core.v2.LwwStamp stamp = 2;
  string day = 3 [(parvane.core.v2.max_len) = 10];
  string kind = 4 [(parvane.core.v2.max_len) = 16];
  string time = 5 [(parvane.core.v2.max_len) = 5];
  string end_time = 6 [(parvane.core.v2.max_len) = 5];
  double value = 7;
  double value2 = 8;
  string name = 9 [(parvane.core.v2.max_len) = 120];
  string details = 10 [(parvane.core.v2.max_len) = 4000];
  parvane.core.v2.LwwStamp deleted = 11;
}

// Слово словаря правок ввода текстом (12 окт 2026): первое слово названия записи → тип записи и
// длительность события, которые пользователь выбирает вместо угаданных. Счётчик — сколько раз подряд
// правка повторилась (клиент подставляет значение с порога 3, потолок 5). Значение и его счётчик —
// два регистра, которые клиент всегда пишет парой: тип и длительность одного слова, исправленные на
// разных устройствах, сохраняются оба. `touched` — счётчик свежести: клиент держит не более 200 слов и
// вытесняет дольше всех не тронутые (надгробием). Сервер словарь не видит, как и остальное содержимое.
message LearnedWord {
  // слово строчными буквами, как его выделяет разбор клиента
  string id = 1 [(parvane.core.v2.max_len) = 64];
  // task | event; пустая строка — тип не выучен
  Str kind = 2;
  U32 kind_count = 3;
  // минуты 5…1440; unset — длительность не выучена
  U32 minutes = 4;
  U32 minutes_count = 5;
  U32 touched = 6;
  parvane.core.v2.LwwStamp deleted = 7;
}

// Строка истории ввода текстом (13 окт 2026): строка, которой пользователь добавил запись, — подсказка
// окна ввода на всех его устройствах. Регистр целиком по `stamp`, надгробие: строки с двух устройств
// объединяются по `id`, у одной и той же строки побеждает позднее использование; «Забыть» — надгробие,
// правка старше него строку не возвращает, новое использование (метка новее) — возвращает.
// `hidden` — не строка, а забытый шаблон: `text` — ключ шаблона, по которому клиент больше не собирает
// подсказку из записей «Плана». `touched` — счётчик свежести, как у LearnedWord: клиент держит не более
// 200 строк и столько же забытых шаблонов, вытесняя дольше всех не тронутые надгробием. Сервер историю
// не видит, как и остальное содержимое.
message QuickLine {
  // ключ строки, его выбирает клиент: хэш строки без учёта регистра и лишних пробелов
  string id = 1 [(parvane.core.v2.max_len) = 64];
  parvane.core.v2.LwwStamp stamp = 2;
  // строка как набрана (клиент ограничивает её 300 знаками) либо ключ забытого шаблона
  string text = 3 [(parvane.core.v2.max_len) = 1200];
  // сколько раз строкой добавлена запись
  uint32 count = 4;
  uint32 touched = 5;
  bool hidden = 6;
  parvane.core.v2.LwwStamp deleted = 7;
}

// 15 окт 2026, этап 4 плана: напоминание уже отправлено — два устройства не пишут его в «Избранное» дважды.
// Ключ — `<id записи>@<день>@<минут до>`; регистр по `stamp` и надгробие, как у строк истории ввода
message Reminded {
  string id = 1 [(parvane.core.v2.max_len) = 96];
  parvane.core.v2.LwwStamp stamp = 2;
  parvane.core.v2.LwwStamp deleted = 3;
}

message NutritionDay {
  string day = 1 [(parvane.core.v2.max_len) = 10];
  repeated FoodEntry entries = 2 [(parvane.core.v2.max_items) = 200];
  Bool is_complete = 3;
  // цели на момент завершения дня
  GoalSet fixed_goals = 4;
  U32 water_ml = 5;
}

// Настройки дня (минуты от полуночи) и дневной бюджет — под одной меткой.
message Settings {
  parvane.core.v2.LwwStamp stamp = 1;
  uint32 day_start = 2;
  uint32 day_end = 3;
  uint32 lunch_start = 4;
  uint32 lunch_end = 5;
  uint32 margin = 6;
  uint32 budget = 7;
}

// Отметка переноса данных этапа 1 (информационная).
message Migration {
  string source_device = 1 [(parvane.core.v2.max_len) = 64];
  uint32 count = 2;
}

// ── операция и снимок ───────────────────────────────────────────────────────

message Change {
  oneof change {
    Task task = 1;
    Event event = 2;
    List list = 3;
    // слияние по полям дня и по записям
    NutritionDay nutrition_day = 4;
    Settings settings = 5;
    GoalSet goals = 6;
    Migration migration = 7;
    GoalPeriod goal_period = 8;
    HealthRecord health = 9;
    LearnedWord learned = 10;
    QuickLine quick_line = 11;
    Reminded reminded = 12;
  }
}

// Открытый текст ContainerOp: пакет изменений одного устройства.
message PlannerOp {
  repeated Change changes = 1 [(parvane.core.v2.max_items) = 500];
}

// Открытый текст Snapshot: сведённое состояние на момент upto_seq.
message PlannerSnapshot {
  repeated Task tasks = 1 [(parvane.core.v2.max_items) = 20000];
  repeated Event events = 2 [(parvane.core.v2.max_items) = 5000];
  repeated List lists = 3 [(parvane.core.v2.max_items) = 100];
  repeated NutritionDay nutrition = 4 [(parvane.core.v2.max_items) = 4000];
  Settings settings = 5;
  GoalSet goals = 6;
  repeated GoalPeriod goal_periods = 7 [(parvane.core.v2.max_items) = 1000];
  repeated HealthRecord health = 8 [(parvane.core.v2.max_items) = 20000];
  // живые слова и надгробия вместе; движок не пишет в снимок больше (planner.rs `MAX_LEARNED_STORED`)
  repeated LearnedWord learned = 9 [(parvane.core.v2.max_items) = 2000];
  // история ввода текстом: живые строки и надгробия вместе, не больше `MAX_QUICK_STORED` (planner.rs)
  repeated QuickLine quick_lines = 10 [(parvane.core.v2.max_items) = 2000];
  repeated Reminded reminded = 11 [(parvane.core.v2.max_items) = 4000];
}
