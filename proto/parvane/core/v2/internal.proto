// Внутренние сообщения шины gateway ↔ шарды (NATS). Клиенты их не шлют и не
// получают: в реестре методов их нет, публиковать в subject'ы методов вправе
// только gateway (ACL NATS).
syntax = "proto3";

package parvane.core.v2;

import "parvane/core/v2/envelope.proto";
import "parvane/core/v2/errors.proto";
import "parvane/core/v2/options.proto";

// Запрос метода от gateway к шарду.
message ShardRequest {
  string method = 1 [(max_len) = 96];
  // Идентифицированная сессия: пользователь и устройство из проверенного JWT.
  // Пусто для PRE и ANON (анонимный канал не несёт личности, класс 11).
  string user = 2 [(max_len) = 255];
  string device_id = 3 [(max_len) = 64];
  // JWT сессии — для проверки шардом (вторая линия защиты); пусто для PRE/ANON.
  string token = 4 [(max_len) = 4096];
  // IP клиента — только для PRE-методов (лимиты входа/регистрации).
  string client_ip = 5 [(max_len) = 64];
  // Тело запроса (тип — по реестру), уже проверенное по лимитам схемы.
  bytes body = 6 [(max_len) = 4194304];
  // Сессия недавно подтвердила пароль (методы с reauth).
  bool reauth_fresh = 7;
  // Роль оператора (server.stats.*).
  bool operator = 8;
  // Федерация (spec 028): запрос пришёл с чужого сервера (домен-отправитель, проверенный подписью кадра). Ставит
  // только шард federation, gateway — никогда. Для канала ID `user` принадлежит этому домену.
  string origin_domain = 9 [
    (max_len) = 128,
    (actor) = ACTOR_SERVER_SET
  ];
}

message ShardResponse {
  oneof result {
    bytes ok = 1 [(max_len) = 4194304];
    Error error = 2;
  }
}

// Часть потока ответа (METHOD_KIND_STREAM).
message ShardStreamChunk {
  uint32 index = 1;
  bool last = 2;
  bytes data = 3 [(max_len) = 716800];
  Error error = 4;
}

// Отзыв устройства: gateway закрывает идентифицированные сессии ≤ 1 с (класс 5). Пустой `device_id` — адрес
// выведен из обращения (смена ника, spec 026): gateway освобождает его каналы присутствия.
message RevokedNotice {
  string user = 1 [(max_len) = 255];
  string device_id = 2 [(max_len) = 64];
}

// ── запросы messenger → identity (subject'ы v2.internal.identity.*) ─────────

// Устройства пользователя: v2 (с сертификатом в журнале) и легаси v1.
message DevicesOfRequest {
  string user = 1 [(max_len) = 255];
}
message DevicesOfResponse {
  repeated string v2_device_ids = 1 [
    (max_items) = 64,
    (max_len) = 64
  ];
  repeated string legacy_device_ids = 2 [
    (max_items) = 64,
    (max_len) = 64
  ];
  // У пользователя есть журнал устройств (корень).
  bool has_v2 = 3;
  // Ключи подписи v2-устройств (olm_ed25519), в порядке v2_device_ids.
  repeated bytes v2_ed25519 = 4 [
    (max_items) = 64,
    (max_len) = 32
  ];
  // Адрес аккаунта (spec 026): прежний ник 30 дней ведёт на новый — доставка идёт в журналы нового адреса.
  string address = 5 [(max_len) = 255];
}

// Проверка права доставки по ключу доступа (сервер хранит только SHA-256).
message DeliveryKeyCheckRequest {
  string user = 1 [(max_len) = 255];
  bytes key_hash = 2 [(max_len) = 32];
}
message DeliveryKeyCheckResponse {
  bool key_ok = 1;
  // Получатель принимает сообщения от незнакомых (по жетону).
  bool strangers_allowed = 2;
}

// Владелец ключа подписи устройства (проверка записей журнала группы).
message KeyOwnerRequest {
  bytes ed25519 = 1 [(max_len) = 32];
}
message KeyOwnerResponse {
  bool found = 1;
  string user = 2 [(max_len) = 255];
  string device_id = 3 [(max_len) = 64];
  bytes root_key = 4 [(max_len) = 32];
  // Прежние адреса той же личности (смена ника, spec 026): права, выданные им, — права владельца ключа.
  repeated string aliases = 5 [
    (max_items) = 16,
    (max_len) = 255
  ];
}

// Проверка слепого жетона ключами выпуска identity (одноразовость — в messenger).
message TokenCheckRequest {
  AnonToken token = 1;
}
message TokenCheckResponse {
  ErrorCode code = 1;
}

// Явные настройки приватности пользователя (identity.privacy.set, FR-040) —
// messenger проверяет «кто может добавлять в группы» (T096; до E6 — вместе с
// полем group_add блоба v1 `msg.chat.setnotify`).
message PrivacyOfRequest {
  string user = 1 [(max_len) = 255];
}
message PrivacyOfResponse {
  // false — пользователь не выставлял настройки через v2.
  bool found = 1;
  // Значения parvane.identity.v2.Audience (1 — все, 2 — контакты, 3 — никто).
  uint32 group_add = 2;
  bool messages_from_strangers = 3;
  uint32 calls_from = 4;
  uint32 presence_visibility = 5;
}

// Публичное имя группы (spec 023): messenger занимает/освобождает имя в общем пространстве с никами пользователей.
message NameClaimRequest {
  string name = 1 [(max_len) = 32];
  // id группы-владельца
  bytes owner = 2 [(max_len) = 64];
  bool release = 3;
}
message NameClaimResponse {
  bool ok = 1;
  // taken | format | reserved
  string reason = 2 [(max_len) = 16];
}

// ── смена ника (spec 026): identity → шарды (subject'ы v2.internal.rename.<шард>) ──
// Запрос с ответом: шард переносит свои строки прежнего адреса на новый (идемпотентно); identity повторяет до
// ответа `ok`.
message RenameNotice {
  string old_address = 1 [(max_len) = 255];
  string new_address = 2 [(max_len) = 255];
  // Устройства аккаунта — для ключей, выведенных из адреса и устройства (журналы инбокса, push).
  repeated string device_ids = 3 [
    (max_items) = 64,
    (max_len) = 64
  ];
  // Удаление аккаунта (spec 027): `new_address` пуст — шард стирает строки `old_address`.
  bool purge = 4;
}
message RenameAck {
  bool ok = 1;
}
