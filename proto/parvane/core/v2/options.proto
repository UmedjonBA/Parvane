// Опции схемы: лимиты полей и акторы. Их читает генератор движка
// (backend/protocol/build.rs) и строит по ним таблицу проверок, которую кодек
// применяет к недоверенным байтам ДО разбора (класс 12, FR-023).
//
// Правило генератора (ошибка сборки, если нарушено):
//   - у каждого поля string/bytes (в т.ч. repeated) есть (max_len) — байты;
//   - у каждого repeated-поля есть (max_items) — число элементов;
//   - map-поля запрещены (у них нет лимитов);
//   - ни один лимит не превышает размер кадра 4 МиБ.
syntax = "proto3";

package parvane.core.v2;

import "google/protobuf/descriptor.proto";

// Кто вправе задавать значение поля.
enum Actor {
  ACTOR_UNSPECIFIED = 0;
  // Обычное поле: значение задаёт отправитель.
  ACTOR_CLIENT = 1;
  // Значение ставит только сервер. Клиентское значение (поле присутствует в
  // кадре от клиента) — отказ INVALID (класс 3, FR-014).
  ACTOR_SERVER_SET = 2;
}

extend google.protobuf.FieldOptions {
  // Максимальная длина в байтах для string/bytes (для repeated — у каждого элемента).
  uint32 max_len = 50001;
  // Максимальное число элементов repeated-поля.
  uint32 max_items = 50002;
  // Актор поля.
  Actor actor = 50003;
}
