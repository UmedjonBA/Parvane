    #   ослеплением основания (время не связано с выбранным клиентом значением) и проверкой результата; ветка 0.10
    #   на crypto-bigint (≥ 0.7.10 — RUSTSEC-2026-0387 закрыт); квота 50 жетонов в сутки на аккаунт.
    #   Перейти на выпуск rsa, как только advisory отметит исправление (`patched` не пуст).
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0387 (crypto-bigint, неравномерное время): 0.7.x обновлён до 0.7.10 (исправлено). Остаётся 0.5.5 —
