    #   (слабые фичи `sqlx-mysql?/…` держат её в lock-файле), но с `default-features = false` и features
    #   ["sqlite", …] она не компилируется — проверка: `cargo tree -i rsa@0.9.10` → «nothing to print».
    # - rsa 0.10.0-rc.18 КОМПИЛИРУЕТСЯ: blind-rsa-signatures 0.18 → parvane-protocol (слепые жетоны, `tokens.rs`,
