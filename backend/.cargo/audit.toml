# P-51 / S7-7 (7 ноя 2026): конфигурация `cargo audit` (запуск: `cd backend && cargo audit`).
[advisories]
ignore = [
    # RUSTSEC-2023-0071 (rsa, Marvin; исправленного выпуска нет ни у 0.9, ни у 0.10-rc).
