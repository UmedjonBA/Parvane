# Parvane на m60-7 (docker compose, без sudo). Файлы на сервере: ~/parvane/
#   .env            — секреты (генерирует deploy.sh при первом деплое)
#   nats/server.prod.conf, Caddyfile, web-dist/ — заливает deploy.sh
# Образ parvane-shards собирается ЛОКАЛЬНО (podman, baseline
# x86-64) и заливаются через docker load — на сервере НЕ собирать.

name: parvane

# P-31: контейнеры без root (USER parvane в образе), read-only rootfs, без
# capabilities, без эскалации; том БД — свой на каждый шард (RCE в preview
# не читает identity.db). Миграция с общего тома `db` — см. OPERATIONS.md.
x-shard-common: &shard-common
  image: localhost/parvane-shards:latest
  restart: unless-stopped
  depends_on:
    - nats
  # OPS-03 (ревью 7 окт 2026): потолок памяти и процессов — исчерпание памяти
  # одним шардом перезапускает его, а не роняет 8-гигабайтный хост целиком
  mem_limit: 768m
  pids_limit: 256
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp

services:
  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/server.prod.conf"]
    # P-50: в контейнер NATS уходят только его пароли, а не весь .env
    environment:
      PARVANE_IDENTITY_PASS: ${PARVANE_IDENTITY_PASS}
      PARVANE_MESSENGER_PASS: ${PARVANE_MESSENGER_PASS}
      PARVANE_CLOUD_PASS: ${PARVANE_CLOUD_PASS}
      PARVANE_NOTES_PASS: ${PARVANE_NOTES_PASS}
      PARVANE_CALENDAR_PASS: ${PARVANE_CALENDAR_PASS}
      PARVANE_CALL_PASS: ${PARVANE_CALL_PASS}
      PARVANE_PREVIEW_PASS: ${PARVANE_PREVIEW_PASS}
      PARVANE_PUSH_PASS: ${PARVANE_PUSH_PASS}
      PARVANE_DOMAINS_PASS: ${PARVANE_DOMAINS_PASS}
      PARVANE_FEDERATION_PASS: ${PARVANE_FEDERATION_PASS}
      PARVANE_GATEWAY_PASS: ${PARVANE_GATEWAY_PASS}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - ./nats/server.prod.conf:/etc/nats/server.prod.conf:ro
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256

  identity:
    <<: *shard-common
    command: ["/usr/local/bin/identity"]
    volumes:
      - db-identity:/data
      - well-known:/well-known
    environment:
      # ID-01: требовать доказательство ключа устройства при входе (включать, когда
      # его шлют все клиенты: web — да, desktop/android — со своих сборок)
      PARVANE_REQUIRE_DEVICE_PROOF: ${PARVANE_REQUIRE_DEVICE_PROOF:-1}
      # Жалобы администратору (spec 024): открытый ключ `escrow_admin keygen`; пусто — жалобы серверу выключены
      PARVANE_REPORT_PUBLIC_KEY: ${PARVANE_REPORT_PUBLIC_KEY:-}
      PARVANE_NATS_URL: nats://nats:4222
      PARVANE_NATS_USER: identity
      PARVANE_NATS_PASS: ${PARVANE_IDENTITY_PASS}
      PARVANE_DB_PATH: /data/identity.db
      # P-11: ключ подписи JWT (Ed25519, PKCS#8 PEM, 0600) — вне SQLite
      PARVANE_JWT_KEY_FILE: /data/identity-jwt-ed25519.pem
      # Протокол v2: ключ сервера (Ed25519, 0600) и описатель для /.well-known/parvane
      PARVANE_SERVER_KEY_FILE: /data/identity-server-ed25519.pem
      PARVANE_WELL_KNOWN_FILE: /well-known/parvane.json
      PARVANE_LOG_LEVEL: info
      # Федерация (spec 028): identity подписывает межсерверные кадры и объявляет точку входа
      PARVANE_FEDERATION: ${PARVANE_FEDERATION:-off}
      PARVANE_S2S_ENDPOINT: ${PARVANE_S2S_ENDPOINT:-}
      PARVANE_FEDERATION_TOKENS_PER_DOMAIN_DAY: ${PARVANE_FEDERATION_TOKENS_PER_DOMAIN_DAY:-2000}
      # Домен адресов: ник на экране входа → ник@домен; регистрация на чужой
      # домен отклоняется
      PARVANE_DOMAIN: ${PARVANE_DOMAIN:-${PARVANE_PUBLIC_HOST}}
      # Открытая регистрация только с подтверждением почты (1) — без пароля на
      # сайт это единственный барьер от мусорных аккаунтов. Без SMTP_HOST код
      # уходит лишь в лог identity (dev-режим) — на проде обязательно задать
      PARVANE_EMAIL_REQUIRED: ${PARVANE_EMAIL_REQUIRED:-1}
      # Подтверждение через Telegram-бота (backend/infra/telegram-bot) — приоритетнее
      # почты; бот живёт на хосте с доступом к api.telegram.org
      PARVANE_TELEGRAM_BOT: ${PARVANE_TELEGRAM_BOT:-}
      PARVANE_TELEGRAM_SECRET: ${PARVANE_TELEGRAM_SECRET:-}
      # Открытый ключ администратора для копий корня пользователей (страховка:
      # потеряны устройства и ключ восстановления). Пара — `escrow_admin keygen`;
      # закрытый ключ на сервер НЕ кладётся. Пусто — страховки нет.
      PARVANE_ESCROW_PUBLIC_KEY: ${PARVANE_ESCROW_PUBLIC_KEY:-}
      PARVANE_SMTP_HOST: ${PARVANE_SMTP_HOST:-}
      PARVANE_SMTP_PORT: ${PARVANE_SMTP_PORT:-587}
      PARVANE_SMTP_USER: ${PARVANE_SMTP_USER:-}
      PARVANE_SMTP_PASS: ${PARVANE_SMTP_PASS:-}
      PARVANE_SMTP_FROM: ${PARVANE_SMTP_FROM:-}

  messenger:
    <<: *shard-common
    command: ["/usr/local/bin/messenger"]
    volumes:
      - db-messenger:/data
    environment:
      PARVANE_NATS_URL: nats://nats:4222
      PARVANE_NATS_USER: messenger
      PARVANE_NATS_PASS: ${PARVANE_MESSENGER_PASS}
      PARVANE_DB_PATH: /data/messenger.db
      # Протокол v2: домен адресов и ссылок (как у identity)
      PARVANE_DOMAIN: ${PARVANE_DOMAIN:-${PARVANE_PUBLIC_HOST}}
      PARVANE_LOG_LEVEL: info

  cloud:
    <<: *shard-common
    command: ["/usr/local/bin/cloud"]
    volumes:
      - db-cloud:/data
    environment:
      PARVANE_NATS_URL: nats://nats:4222
      PARVANE_NATS_USER: cloud
      PARVANE_NATS_PASS: ${PARVANE_CLOUD_PASS}
      PARVANE_DB_PATH: /data/cloud.db
      PARVANE_LOG_LEVEL: info
      # Раздел «Облако» (spec 016): место на аккаунт и предел одного файла
      # (шифртекст; 2 ГиБ открытого текста + запас PVB2). Медиа чатов — прежние
      # пределы шарда (4 ГиБ / 512 МиБ).
      PARVANE_CLOUD_DRIVE_QUOTA_BYTES: ${PARVANE_CLOUD_DRIVE_QUOTA_BYTES:-10737418240}
      PARVANE_CLOUD_DRIVE_MAX_FILE_BYTES: ${PARVANE_CLOUD_DRIVE_MAX_FILE_BYTES:-2306867200}
      # Ссылки облака для людей без аккаунта (spec 022): выключатель создания
      # (0 — новых ссылок нет, прежние живут до срока либо отзыва), файлов в
      # одной ссылке, ссылок на аккаунт, дней на продление истёкшей ссылки.
      PARVANE_CLOUD_LINKS_ENABLED: ${PARVANE_CLOUD_LINKS_ENABLED:-1}
      PARVANE_CLOUD_LINK_MAX_FILES: ${PARVANE_CLOUD_LINK_MAX_FILES:-500}
      PARVANE_CLOUD_LINKS_PER_OWNER: ${PARVANE_CLOUD_LINKS_PER_OWNER:-100}
      PARVANE_CLOUD_LINK_GRACE_DAYS: ${PARVANE_CLOUD_LINK_GRACE_DAYS:-30}

  call:
    <<: *shard-common
    command: ["/usr/local/bin/call"]
    volumes:
      - db-call:/data
    environment:
      PARVANE_NATS_URL: nats://nats:4222
      PARVANE_NATS_USER: call
      PARVANE_NATS_PASS: ${PARVANE_CALL_PASS}
      PARVANE_DB_PATH: /data/call.db
      PARVANE_LOG_LEVEL: info
      # Домен сервера: без него шард считает домен `local` и отклоняет ВСЕ сигналы
      # звонков v2 как «чужой домен» (прод, 5–10 окт 2026: звонки не доходили)
      PARVANE_DOMAIN: ${PARVANE_DOMAIN:-${PARVANE_PUBLIC_HOST}}
      # Внешний TURN (VPS с публичным IP) переопределяется в .env:
      # PARVANE_TURN_URL=turn:host:3478?transport=udp,turn:host:3478?transport=tcp
      PARVANE_STUN_URLS: ${PARVANE_STUN_URLS:-stun:${PARVANE_PUBLIC_HOST}:${PARVANE_TURN_PUBLIC_PORT}}
      PARVANE_TURN_URL: ${PARVANE_TURN_URL:-turn:${PARVANE_PUBLIC_HOST}:${PARVANE_TURN_PUBLIC_PORT}?transport=udp}
      PARVANE_TURN_SECRET: ${PARVANE_TURN_SECRET}

  preview:
    <<: *shard-common
    command: ["/usr/local/bin/preview"]
    volumes:
      - db-preview:/data
    environment:
      PARVANE_NATS_URL: nats://nats:4222
      PARVANE_NATS_USER: preview
      PARVANE_NATS_PASS: ${PARVANE_PREVIEW_PASS}
      PARVANE_DB_PATH: /data/preview.db
      PARVANE_LOG_LEVEL: info

  push:
    <<: *shard-common
    command: ["/usr/local/bin/push"]
    volumes:
      - db-push:/data
    environment:
      PARVANE_NATS_URL: nats://nats:4222
      PARVANE_NATS_USER: push
      PARVANE_NATS_PASS: ${PARVANE_PUSH_PASS}
      PARVANE_DB_PATH: /data/push.db
      # P-11: приватный VAPID-ключ (P-256, PKCS#8 PEM, 0600) — вне SQLite
      PARVANE_VAPID_KEY_FILE: /data/push-vapid-p256.pem
      PARVANE_LOG_LEVEL: info

  # Каркас доменов v2 (spec 010 — планировщик): журналы контейнеров, гранты,
  # снимки; только шифртекст
  domains:
    <<: *shard-common
    command: ["/usr/local/bin/domains"]
    volumes:
      - db-domains:/data
    environment:
      PARVANE_NATS_URL: nats://nats:4222
      PARVANE_NATS_USER: domains
      PARVANE_NATS_PASS: ${PARVANE_DOMAINS_PASS}
      PARVANE_DB_PATH: /data/domains.db
      PARVANE_DOMAIN: ${PARVANE_DOMAIN:-${PARVANE_PUBLIC_HOST}}
      PARVANE_LOG_LEVEL: info

  # Федерация (spec 028): единственный, кто ходит к другим серверам (HTTPS, SSRF-фильтр) и принимает их
  # запросы (/_parvane/s2s за Caddy). Выключатель — PARVANE_FEDERATION, чёрный список —
  # PARVANE_FEDERATION_BLOCK и `docker compose exec federation federation_admin block <домен>`.
  federation:
    <<: *shard-common
    command: ["/usr/local/bin/federation"]
    volumes:
      - db-federation:/data
      - well-known:/well-known:ro
    environment:
      PARVANE_NATS_URL: nats://nats:4222
      PARVANE_NATS_USER: federation
      PARVANE_NATS_PASS: ${PARVANE_FEDERATION_PASS}
      PARVANE_DB_PATH: /data/federation.db
      PARVANE_DOMAIN: ${PARVANE_DOMAIN:-${PARVANE_PUBLIC_HOST}}
      PARVANE_FEDERATION: ${PARVANE_FEDERATION:-off}
      PARVANE_FEDERATION_BIND: 0.0.0.0:9330
      PARVANE_FEDERATION_ENDPOINTS: ${PARVANE_FEDERATION_ENDPOINTS:-}
      PARVANE_FEDERATION_BLOCK: ${PARVANE_FEDERATION_BLOCK:-}
      PARVANE_WELL_KNOWN_FILE: /well-known/parvane.json
      PARVANE_LOG_LEVEL: info

  gateway:
    image: localhost/parvane-shards:latest
    command: ["/usr/local/bin/gateway"]
    restart: unless-stopped
    depends_on:
      - nats
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      PARVANE_NATS_URL: nats://nats:4222
      PARVANE_NATS_USER: gateway
      PARVANE_NATS_PASS: ${PARVANE_GATEWAY_PASS}
      # Федерация (spec 028): запрос с чужим dest_domain уходит шарду federation
      PARVANE_DOMAIN: ${PARVANE_DOMAIN:-${PARVANE_PUBLIC_HOST}}
      PARVANE_GATEWAY_BIND: 0.0.0.0:9222
      PARVANE_GATEWAY_TCP_BIND: 0.0.0.0:9223
      # За Caddy все WS-клиенты приходят с ОДНОГО IP (контейнер caddy), поэтому
      # per-IP лимит по умолчанию (64) стал бы общим потолком на всех веб-юзеров
      # и per-IP защита не различала бы клиентов. Поднимаем до глобального лимита;
      # защита от abuse — на уровне conn-лимита и (позже) rate-limit в Caddy.
      PARVANE_GATEWAY_MAX_CONNS: "2000"
      PARVANE_GATEWAY_MAX_CONNS_PER_IP: "2000"
      PARVANE_LOG_LEVEL: info
    mem_limit: 1g
    pids_limit: 512

  caddy:
    image: localhost/parvane-caddy:latest
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - gateway
    ports:
      - "443:443"
      - "80:80"
    environment:
      PARVANE_PUBLIC_HOST: ${PARVANE_PUBLIC_HOST}
      PARVANE_PUBLIC_HTTPS_PORT: ${PARVANE_PUBLIC_HTTPS_PORT}
      # Basic-auth приватного круга (bcrypt). Пусто/не задано в Caddyfile = гейт off
      PARVANE_SITE_USER: ${PARVANE_SITE_USER:-parvane}
      PARVANE_SITE_HASH: ${PARVANE_SITE_HASH:-}
      # Токен DuckDNS для ACME DNS-01 (в .env, не в репо)
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Заголовок Onion-Location (spec 025): файл пишет deploy.sh по адресу скрытого сервиса
      - ./onion-location.caddy:/etc/caddy/onion-location.caddy:ro
      - ./web-dist:/srv/dist:ro
      - caddy-data:/data
      - caddy-config:/config
      - well-known:/srv/well-known:ro

  # Скрытый сервис Tor (spec 025): адрес .onion → сайт Caddy :8081 (web-клиент и /ws) без раскрытия IP
  # пользователя. Живёт в сетевом пространстве caddy, портов наружу нет; ключ адреса — в томе tor-data.
  tor:
    image: localhost/parvane-tor:latest
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 64
    network_mode: "service:caddy"
    depends_on:
      - caddy
    volumes:
      - tor-data:/var/lib/tor

  # TURN/STUN вынесен на VPS 213.155.15.139 (см. OPERATIONS.md «TURN на VPS»):
  # relay хостера снаружи недостижим. Локальный контейнер turn удалён.

volumes:
  db-identity:
  db-messenger:
  db-cloud:
  db-call:
  db-preview:
  db-push:
  db-domains:
  db-federation:
  caddy-data:
  caddy-config:
  well-known:
  tor-data:
