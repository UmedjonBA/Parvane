# Прокси для «Найти и скачать» прода (backend/infra/deploy/OPERATIONS.md, «Музыка»): с прод-сервера YouTube и
# SoundCloud закрыты, с VPS бота открыты. Ставится на VPS бота (84.19.3.252) как /etc/tinyproxy/tinyproxy.conf;
# строку BasicAuth дописывает установка (пароль — только на VPS и в .env прода, PARVANE_MUSIC_FETCH_PROXY).
# Снаружи к VPS открыт только ssh: прод достаёт прокси пересылкой порта (сервис compose `music-tunnel`).
User tinyproxy
Group tinyproxy
Port 18088
Listen 127.0.0.1
Timeout 120
MaxClients 16
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Warning
PidFile "/run/tinyproxy/tinyproxy.pid"
DisableViaHeader Yes
# Только пересылка ssh с прода (пользователь musictunnel)
Allow 127.0.0.1
# Источники — по HTTPS
ConnectPort 443
