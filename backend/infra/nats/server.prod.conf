# Parvane NATS — ПРОД. Отличия от server.conf (dev):
#  - пароли из окружения ($VAR), не хардкодом;
#  - НЕТ юзера `client` (клиенты ходят только через gateway);
#  - НЕТ юзера `dev` с правами ">".
# Запуск: nats-server -c server.prod.conf (переменные заданы в окружении).
# TLS — через infra/tls/nats-tls.conf (include ниже при необходимости).

port: 4222
# Запас над gateway MAX_FRAME_BYTES (4 МиБ): страница sync и чанки+base64 не
# должны упираться в дефолтный лимит 1 МиБ (P-09/P-52).
max_payload: 8MB

authorization {
  users = [
    {
      user: identity
      password: $PARVANE_IDENTITY_PASS
      permissions: {
        subscribe: [
          # >>> v2 identity subscribe (gen_registry — не править руками)
          "_INBOX.>", "v2.identity.account.change_password", "v2.identity.account.confirm_email", "v2.identity.account.confirm_telegram",
          "v2.identity.account.register", "v2.identity.account.register_status", "v2.identity.account.set_2fa", "v2.identity.delivery_key.set",
          "v2.identity.device.fetch_bundle", "v2.identity.device.fetch_bundle_anon", "v2.identity.device.list", "v2.identity.device.log_append",
          "v2.identity.device.log_sync", "v2.identity.device.log_sync_anon", "v2.identity.device.publish_certificate", "v2.identity.device.revoke",
          "v2.identity.directory.search", "v2.identity.link.challenge", "v2.identity.link.grant", "v2.identity.link.offer",
          "v2.identity.link.poll", "v2.identity.privacy.get", "v2.identity.privacy.set", "v2.identity.profile.resolve",
          "v2.identity.profile.set_avatar", "v2.identity.profile.set_name", "v2.identity.root.backup_get", "v2.identity.root.backup_set",
          "v2.identity.root.rotate", "v2.identity.session.issue", "v2.identity.session.reauth", "v2.identity.tokens.issue_blinded",
          "v2.identity.tokens.key_list", "v2.internal.identity.>", "v2.server.describe", "v2.server.stats.versions",
          # <<< v2
          "identity.token.issue", "identity.token.verify", "identity.user.register", "identity.email.confirm", "identity.server.info", "identity.telegram.confirm", "identity.register.status",
          "identity.user.search", "identity.user.setname", "identity.user.setavatar", "identity.user.twofa", "identity.password.change",
          "identity.user.setkey", "identity.user.resolve",
          "identity.prekeys.publish", "identity.prekeys.fetch", "identity.device.list", "identity.device.revoke", "identity.link.offer", "identity.link.poll", "identity.link.grant", "identity.link.challenge"
        ]
        publish: [
          # >>> v2 identity publish (gen_registry — не править руками)
          "v2.inbox.>", "v2.revoked",
          # <<< v2
          "_INBOX.>"
        ]
      }
    }

    {
      user: messenger
      password: $PARVANE_MESSENGER_PASS
      permissions: {
        subscribe: [
          # >>> v2 messenger subscribe (gen_registry — не править руками)
          "v2.group.epoch.publish_send_key", "v2.group.invite.check", "v2.group.invite.create", "v2.group.invite.delete",
          "v2.group.invite.list", "v2.group.invite.revoke", "v2.group.join", "v2.group.request.decide",
          "v2.group.request.list", "v2.group.state.append", "v2.group.state.sync", "v2.internal.messenger.group_epoch",
          "v2.msg.deliver_group", "v2.msg.deliver_legacy", "v2.msg.deliver_sealed", "v2.msg.inbox.ack",
          "v2.msg.inbox.hide", "v2.msg.inbox.sync", "v2.state.append", "v2.state.sync",
          # <<< v2
          "msg.chat.send", "msg.chat.read", "msg.chat.edit", "msg.chat.delete",
          "msg.chat.react", "msg.chat.pin", "msg.chat.clear", "msg.chat.setnotify", "msg.chat.ack", "msg.sync.request", "msg.chat.readers",
          "group.create", "group.addmember", "group.removemember",
          "group.setrole", "group.ban", "group.unban", "group.mute",
          "group.invite.create", "group.join", "group.rename", "group.delete", "group.list", "group.info",
          "group.setinfo", "group.setperms", "group.setadmin",
          "group.invite.list", "group.invite.revoke", "group.invite.delete", "group.invite.check",
          "group.request.list", "group.request.decide",
          "_INBOX.>"
        ]
        publish: [
          # >>> v2 messenger publish (gen_registry — не править руками)
          "v2.inbox.>", "v2.internal.identity.>",
          # <<< v2
          "msg.user.>", "_INBOX.>", "identity.token.verify"
        ]
      }
    }

    {
      user: cloud
      password: $PARVANE_CLOUD_PASS
      permissions: {
        subscribe: [
          # >>> v2 cloud subscribe (gen_registry — не править руками)
          "v2.cloud.blob.delete", "v2.cloud.blob.download", "v2.cloud.blob.download_cap", "v2.cloud.blob.upload_chunk",
          "v2.cloud.blob.upload_complete",
          # <<< v2
          "file.upload.chunk", "file.upload.complete", "file.download.request",
          "file.list.request", "file.delete", "_INBOX.>"
        ]
        publish: [
          # >>> v2 cloud publish (gen_registry — не править руками)
          # <<< v2
          "_INBOX.>", "identity.token.verify"
        ]
      }
    }

    {
      user: notes
      password: $PARVANE_NOTES_PASS
      permissions: {
        subscribe: [
          "note.create", "note.update", "note.delete", "note.sync.request",
          "_INBOX.>"
        ]
        publish: ["_INBOX.>", "identity.token.verify"]
      }
    }

    {
      user: calendar
      password: $PARVANE_CALENDAR_PASS
      permissions: {
        subscribe: [
          "cal.event.create", "cal.event.update", "cal.event.delete",
          "cal.sync.request", "_INBOX.>"
        ]
        publish: ["_INBOX.>", "identity.token.verify"]
      }
    }

    {
      user: call
      password: $PARVANE_CALL_PASS
      permissions: {
        subscribe: [
          # >>> v2 call subscribe (gen_registry — не править руками)
          "v2.call.ice_config", "v2.call.ring_sealed", "v2.call.signal_sealed",
          # <<< v2
          "call.signal", "call.history.request", "call.ice.request", "_INBOX.>"
        ]
        publish: [
          # >>> v2 call publish (gen_registry — не править руками)
          "v2.inbox.>", "v2.internal.identity.>",
          # <<< v2
          "call.user.>", "_INBOX.>", "identity.token.verify"
        ]
      }
    }

    # Preview шард (SSRF-safe fetcher превью ссылок)
    {
      user: preview
      password: $PARVANE_PREVIEW_PASS
      permissions: {
        subscribe: [
          # >>> v2 preview subscribe (gen_registry — не править руками)
          "v2.preview.link", "v2.preview.map_tile",
          # <<< v2
          "preview.link.fetch", "preview.map.tile", "_INBOX.>"
        ]
        publish: [
          # >>> v2 preview publish (gen_registry — не править руками)
          # <<< v2
          "_INBOX.>", "identity.token.verify"
        ]
      }
    }

    # Push шард (web-push VAPID для офлайн-устройств; контент инбоксов sealed)
    {
      user: push
      password: $PARVANE_PUSH_PASS
      permissions: {
        subscribe: [
          # >>> v2 push subscribe (gen_registry — не править руками)
          "v2.inbox.>", "v2.push.wake.describe", "v2.push.wake.register", "v2.push.wake.unregister",
          # <<< v2
          "push.vapid.get", "push.device.register", "push.device.unregister", "msg.user.>", "_INBOX.>"
        ]
        publish: [
          # >>> v2 push publish (gen_registry — не править руками)
          # <<< v2
          "_INBOX.>", "identity.token.verify"
        ]
      }
    }

    # Единственная точка входа клиентов. Изоляция «людей» — внутри gateway (JWT).
    {
      user: gateway
      password: $PARVANE_GATEWAY_PASS
      permissions: {
        publish: [
          # >>> v2 gateway publish (gen_registry — не править руками)
          "v2.call.ice_config", "v2.call.ring_sealed", "v2.call.signal_sealed", "v2.cloud.blob.delete",
          "v2.cloud.blob.download", "v2.cloud.blob.download_cap", "v2.cloud.blob.upload_chunk", "v2.cloud.blob.upload_complete",
          "v2.domain.container.create", "v2.domain.container.get", "v2.domain.grant.list", "v2.domain.grant.revoke",
          "v2.domain.grant.set", "v2.domain.op.append", "v2.domain.op.sync", "v2.domain.snapshot.get",
          "v2.domain.snapshot.put", "v2.eph.>", "v2.group.epoch.publish_send_key", "v2.group.invite.check",
          "v2.group.invite.create", "v2.group.invite.delete", "v2.group.invite.list", "v2.group.invite.revoke",
          "v2.group.join", "v2.group.request.decide", "v2.group.request.list", "v2.group.state.append",
          "v2.group.state.sync", "v2.identity.account.change_password", "v2.identity.account.confirm_email", "v2.identity.account.confirm_telegram",
          "v2.identity.account.register", "v2.identity.account.register_status", "v2.identity.account.set_2fa", "v2.identity.delivery_key.set",
          "v2.identity.device.fetch_bundle", "v2.identity.device.fetch_bundle_anon", "v2.identity.device.list", "v2.identity.device.log_append",
          "v2.identity.device.log_sync", "v2.identity.device.log_sync_anon", "v2.identity.device.publish_certificate", "v2.identity.device.revoke",
          "v2.identity.directory.search", "v2.identity.link.challenge", "v2.identity.link.grant", "v2.identity.link.offer",
          "v2.identity.link.poll", "v2.identity.privacy.get", "v2.identity.privacy.set", "v2.identity.profile.resolve",
          "v2.identity.profile.set_avatar", "v2.identity.profile.set_name", "v2.identity.root.backup_get", "v2.identity.root.backup_set",
          "v2.identity.root.rotate", "v2.identity.session.issue", "v2.identity.session.reauth", "v2.identity.tokens.issue_blinded",
          "v2.identity.tokens.key_list", "v2.internal.messenger.group_epoch", "v2.msg.deliver_group", "v2.msg.deliver_legacy",
          "v2.msg.deliver_sealed", "v2.msg.inbox.ack", "v2.msg.inbox.hide", "v2.msg.inbox.sync",
          "v2.preview.link", "v2.preview.map_tile", "v2.push.wake.describe", "v2.push.wake.register",
          "v2.push.wake.unregister", "v2.server.describe", "v2.server.stats.versions", "v2.state.append",
          "v2.state.sync",
          # <<< v2
          "identity.token.issue", "identity.token.verify", "identity.user.register", "identity.email.confirm", "identity.server.info", "identity.telegram.confirm", "identity.register.status",
          "identity.user.search", "identity.user.setname", "identity.user.setavatar", "identity.user.twofa", "identity.password.change",
          "identity.user.setkey", "identity.user.resolve",
          "identity.prekeys.publish", "identity.prekeys.fetch", "identity.device.list", "identity.device.revoke", "identity.link.offer", "identity.link.poll", "identity.link.grant", "identity.link.challenge",
          "msg.chat.send", "msg.chat.read", "msg.chat.edit", "msg.chat.delete",
          "msg.chat.react", "msg.chat.pin", "msg.chat.clear", "msg.chat.setnotify", "msg.chat.ack", "msg.sync.request", "msg.chat.readers",
          "file.upload.chunk", "file.upload.complete", "file.download.request",
          "file.list.request", "file.delete", "call.signal", "call.history.request", "call.ice.request",
          "group.create", "group.addmember", "group.removemember",
          "group.setrole", "group.ban", "group.unban", "group.mute",
          "group.invite.create", "group.join", "group.rename", "group.delete", "group.list", "group.info",
          "group.setinfo", "group.setperms", "group.setadmin",
          "group.invite.list", "group.invite.revoke", "group.invite.delete", "group.invite.check",
          "group.request.list", "group.request.decide",
          "preview.link.fetch", "preview.map.tile", "push.vapid.get", "push.device.register", "push.device.unregister",
          "msg.typing.>", "presence.>"
        ]
        subscribe: [
          # >>> v2 gateway subscribe (gen_registry — не править руками)
          "v2.eph.>", "v2.inbox.>", "v2.revoked",
          # <<< v2
          "msg.user.>", "call.user.>", "msg.typing.>", "presence.>", "_INBOX.>"
        ]
      }
    }
  ]
}
