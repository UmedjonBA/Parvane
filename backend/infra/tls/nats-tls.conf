# nats-server с TLS (шифрование сигналинга). Запуск:
#   nats-server -c infra/tls/nats-tls.conf
# Пути к сертам — относительно рабочего каталога; правь под своё расположение.
# verify:false — не требуем клиентских сертов (шифрование без mTLS); клиентам
# достаточно доверять CA (ca.pem) через PARVANE_NATS_TLS_CA.
port: 4222

tls {
    cert_file: "infra/tls/server.pem"
    key_file:  "infra/tls/server-key.pem"
    ca_file:   "infra/tls/ca.pem"
    verify:    false
    timeout:   5
}
