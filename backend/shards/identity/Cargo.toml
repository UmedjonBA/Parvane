sqlx = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = "0.5"
rand = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
