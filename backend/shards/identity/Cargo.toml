[package]
name = "identity"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "identity"
path = "src/main.rs"

[dependencies]
parvane-types = { path = "../../shared/parvane-types" }
parvane-db = { path = "../../shared/parvane-db" }
parvane-protocol = { path = "../../protocol" }
parvane-v2rt = { path = "../../shared/parvane-v2rt" }
prost = "0.14"
tokio = { workspace = true }
async-nats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
jsonwebtoken = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "rand_core"] }
argon2 = "0.5"
rand = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
futures = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder"] }
