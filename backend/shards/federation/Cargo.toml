[package]
name = "federation"
version = "0.1.0"
edition = "2021"
description = "Шард федерации (spec 028): межсерверные запросы к чужим серверам и приём их запросов"

[[bin]]
name = "federation"
path = "src/main.rs"

[[bin]]
name = "federation_admin"
path = "src/bin/federation_admin.rs"

[features]
# Тестовый транспорт без TLS (только loopback из PARVANE_FEDERATION_ENDPOINTS и только вместе с
# PARVANE_FEDERATION_INSECURE_HTTP=1). В образ прода НЕ собирается — сторож в parvane-types.
insecure-test-transport = []

[dependencies]
parvane-types = { path = "../../shared/parvane-types" }
parvane-db = { path = "../../shared/parvane-db" }
parvane-protocol = { path = "../../protocol" }
parvane-netguard = { path = "../../shared/parvane-netguard" }
futures = { workspace = true }
prost = "0.14"
sha2 = "0.10"
serde_json = { workspace = true }
tokio = { workspace = true }
async-nats = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
