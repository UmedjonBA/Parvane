[package]
name = "domains"
version = "0.1.0"
edition = "2021"
description = "Шард каркаса доменов протокола v2 (spec 007, US4): журналы контейнеров, гранты, снимки"

[[bin]]
name = "domains"
path = "src/main.rs"

[dependencies]
parvane-types = { path = "../../shared/parvane-types" }
parvane-db = { path = "../../shared/parvane-db" }
parvane-protocol = { path = "../../protocol" }
parvane-v2rt = { path = "../../shared/parvane-v2rt" }
prost = "0.14"
tokio = { workspace = true }
async-nats = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dotenvy = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
