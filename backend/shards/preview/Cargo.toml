[package]
name = "preview"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "preview"
path = "src/main.rs"

[dependencies]
parvane-types = { path = "../../shared/parvane-types" }
parvane-db = { path = "../../shared/parvane-db" }
parvane-netguard = { path = "../../shared/parvane-netguard" }
parvane-protocol = { path = "../../protocol" }
parvane-v2rt = { path = "../../shared/parvane-v2rt" }
prost = "0.14"
tokio = { workspace = true }
